<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 Editor Visual de Código</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e1e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #2d2d2d;
      padding: 15px;
      border-bottom: 2px solid #007acc;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header h1 {
      font-size: 18px;
      color: #007acc;
      flex: 1;
    }

    .header button {
      padding: 8px 16px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .header button:hover {
      background: #005a9e;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* PAINEL ESQUERDO - CÓDIGO */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #3e3e42;
    }

    .code-header {
      background: #2d2d2d;
      padding: 10px;
      border-bottom: 1px solid #3e3e42;
      font-size: 12px;
      color: #999;
    }

    .code-input {
      flex: 1;
      background: #1e1e1e;
      color: #d4d4d4;
      border: none;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      resize: none;
      overflow: auto;
    }

    .code-input:focus {
      outline: none;
      background: #252526;
    }

    /* PAINEL CENTRAL - PREVIEW */
    .center-panel {
      flex: 1.5;
      display: flex;
      flex-direction: column;
      border-right: 2px solid #3e3e42;
    }

    .preview-header {
      background: #2d2d2d;
      padding: 10px;
      border-bottom: 1px solid #3e3e42;
      font-size: 12px;
      color: #999;
    }

    .preview-container {
      flex: 1;
      background: white;
      overflow: auto;
      position: relative;
    }

    .preview-content {
      padding: 20px;
    }

    /* ELEMENTO SELECIONADO */
    .element-selected {
      outline: 2px solid #007acc !important;
      outline-offset: 2px;
      position: relative;
    }

    .element-selected::after {
      content: '✓ Selecionado';
      position: absolute;
      top: -25px;
      left: 0;
      background: #007acc;
      color: white;
      padding: 2px 8px;
      font-size: 11px;
      border-radius: 3px;
      white-space: nowrap;
    }

    /* PAINEL DIREITO - PROPRIEDADES */
    .right-panel {
      width: 300px;
      background: #252526;
      border-left: 2px solid #3e3e42;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .props-header {
      background: #2d2d2d;
      padding: 12px;
      border-bottom: 1px solid #3e3e42;
      font-size: 12px;
      color: #007acc;
      font-weight: bold;
    }

    .props-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .prop-group {
      margin-bottom: 16px;
    }

    .prop-group-title {
      color: #007acc;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .prop-item {
      margin-bottom: 10px;
    }

    .prop-label {
      color: #999;
      font-size: 11px;
      margin-bottom: 4px;
      display: block;
    }

    .prop-input {
      width: 100%;
      background: #3e3e42;
      color: #d4d4d4;
      border: 1px solid #555;
      padding: 6px;
      border-radius: 3px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }

    .prop-input:focus {
      outline: none;
      border-color: #007acc;
      background: #1e1e1e;
    }

    .prop-color {
      width: 100%;
      height: 30px;
      border: 1px solid #555;
      border-radius: 3px;
      cursor: pointer;
    }

    .prop-select {
      width: 100%;
      background: #3e3e42;
      color: #d4d4d4;
      border: 1px solid #555;
      padding: 6px;
      border-radius: 3px;
      font-size: 12px;
    }

    .prop-select:focus {
      outline: none;
      border-color: #007acc;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .button-group button {
      flex: 1;
      padding: 8px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .button-group button:hover {
      background: #005a9e;
    }

    .button-group button.danger {
      background: #d13438;
    }

    .button-group button.danger:hover {
      background: #a1262f;
    }

    /* SCROLL */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    ::-webkit-scrollbar-thumb {
      background: #464647;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #5a5a5a;
    }

    .no-selection {
      color: #999;
      padding: 20px;
      text-align: center;
      font-size: 12px;
    }

    .status-bar {
      background: #2d2d2d;
      padding: 8px 15px;
      border-top: 1px solid #3e3e42;
      font-size: 11px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎨 Editor Visual de Código</h1>
    <button onclick="importarCodigo()">📥 Importar HTML</button>
    <button onclick="limparTudo()">🗑️ Limpar</button>
    <button onclick="salvarCodigo()">💾 Salvar</button>
  </div>

  <div class="container">
    <!-- PAINEL ESQUERDO: CÓDIGO -->
    <div class="left-panel">
      <div class="code-header">📝 Código HTML</div>
      <textarea id="codeInput" class="code-input" placeholder="Cole seu código HTML aqui ou clique em 'Importar HTML'..."></textarea>
    </div>

    <!-- PAINEL CENTRAL: PREVIEW -->
    <div class="center-panel">
      <div class="preview-header">👁️ Preview (Clique nos elementos para editar)</div>
      <div class="preview-container">
        <div id="previewContent" class="preview-content"></div>
      </div>
    </div>

    <!-- PAINEL DIREITO: PROPRIEDADES -->
    <div class="right-panel">
      <div class="props-header">⚙️ Propriedades</div>
      <div class="props-content" id="propsContent">
        <div class="no-selection">Clique em um elemento para editar suas propriedades</div>
      </div>
    </div>
  </div>

  <div class="status-bar" id="statusBar">Pronto para editar</div>

  <script>
    let selectedElement = null;
    let originalCode = '';

    // IMPORTAR CÓDIGO
    function importarCodigo() {
      const codigo = prompt("Cole seu código HTML aqui:");
      if (codigo) {
        document.getElementById('codeInput').value = codigo;
        renderizarPreview();
      }
    }

    // RENDERIZAR PREVIEW
    function renderizarPreview() {
      const codigo = document.getElementById('codeInput').value;
      originalCode = codigo;
      
      try {
        const preview = document.getElementById('previewContent');
        preview.innerHTML = codigo;
        
        // Adicionar listeners aos elementos
        adicionarListeners(preview);
        
        document.getElementById('statusBar').textContent = '✅ Código renderizado com sucesso';
      } catch (e) {
        document.getElementById('statusBar').textContent = '❌ Erro ao renderizar: ' + e.message;
      }
    }

    // ADICIONAR LISTENERS
    function adicionarListeners(container) {
      const elementos = container.querySelectorAll('*');
      
      elementos.forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          selecionarElemento(el);
        });
        
        el.addEventListener('mouseover', (e) => {
          e.stopPropagation();
          el.style.outline = '1px dashed #007acc';
          el.style.outlineOffset = '2px';
        });
        
        el.addEventListener('mouseout', (e) => {
          e.stopPropagation();
          if (el !== selectedElement) {
            el.style.outline = 'none';
          }
        });
      });
    }

    // SELECIONAR ELEMENTO
    function selecionarElemento(el) {
      // Remover seleção anterior
      if (selectedElement) {
        selectedElement.classList.remove('element-selected');
        selectedElement.style.outline = 'none';
      }
      
      // Selecionar novo
      selectedElement = el;
      selectedElement.classList.add('element-selected');
      
      // Mostrar propriedades
      mostrarPropriedades(el);
      
      document.getElementById('statusBar').textContent = `Selecionado: <${el.tagName.toLowerCase()}>`;
    }

    // MOSTRAR PROPRIEDADES
    function mostrarPropriedades(el) {
      const props = document.getElementById('propsContent');
      
      const styles = window.getComputedStyle(el);
      
      props.innerHTML = `
        <div class="prop-group">
          <div class="prop-group-title">📍 Elemento</div>
          <div class="prop-item">
            <label class="prop-label">Tag:</label>
            <input type="text" class="prop-input" value="${el.tagName}" disabled>
          </div>
          <div class="prop-item">
            <label class="prop-label">ID:</label>
            <input type="text" class="prop-input" id="propId" value="${el.id || ''}" onchange="atualizarPropriedade('id', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Classe:</label>
            <input type="text" class="prop-input" id="propClass" value="${el.className || ''}" onchange="atualizarPropriedade('className', this.value)">
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-group-title">🎨 Cores</div>
          <div class="prop-item">
            <label class="prop-label">Cor do Texto:</label>
            <input type="color" class="prop-color" value="${hexToColor(styles.color)}" onchange="atualizarEstilo('color', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Fundo:</label>
            <input type="color" class="prop-color" value="${hexToColor(styles.backgroundColor)}" onchange="atualizarEstilo('backgroundColor', this.value)">
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-group-title">📏 Tamanho</div>
          <div class="prop-item">
            <label class="prop-label">Largura:</label>
            <input type="text" class="prop-input" value="${styles.width}" onchange="atualizarEstilo('width', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Altura:</label>
            <input type="text" class="prop-input" value="${styles.height}" onchange="atualizarEstilo('height', this.value)">
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-group-title">🔤 Texto</div>
          <div class="prop-item">
            <label class="prop-label">Tamanho da Fonte:</label>
            <input type="text" class="prop-input" value="${styles.fontSize}" onchange="atualizarEstilo('fontSize', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Alinhamento:</label>
            <select class="prop-select" onchange="atualizarEstilo('textAlign', this.value)">
              <option value="left" ${styles.textAlign === 'left' ? 'selected' : ''}>Esquerda</option>
              <option value="center" ${styles.textAlign === 'center' ? 'selected' : ''}>Centro</option>
              <option value="right" ${styles.textAlign === 'right' ? 'selected' : ''}>Direita</option>
            </select>
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-group-title">📦 Espaçamento</div>
          <div class="prop-item">
            <label class="prop-label">Padding:</label>
            <input type="text" class="prop-input" value="${styles.padding}" onchange="atualizarEstilo('padding', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Margin:</label>
            <input type="text" class="prop-input" value="${styles.margin}" onchange="atualizarEstilo('margin', this.value)">
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-group-title">✏️ Conteúdo</div>
          <div class="prop-item">
            <label class="prop-label">Texto:</label>
            <textarea class="prop-input" style="height: 60px; resize: vertical;" onchange="atualizarTexto(this.value)">${el.textContent}</textarea>
          </div>
        </div>

        <div class="button-group">
          <button onclick="copiarCodigo()">📋 Copiar Código</button>
          <button onclick="atualizarCodigoFonte()" class="danger">🔄 Atualizar</button>
        </div>
      `;
    }

    // ATUALIZAR ESTILO
    function atualizarEstilo(propriedade, valor) {
      if (selectedElement) {
        selectedElement.style[propriedade] = valor;
        atualizarCodigoFonte();
      }
    }

    // ATUALIZAR PROPRIEDADE
    function atualizarPropriedade(propriedade, valor) {
      if (selectedElement) {
        selectedElement[propriedade] = valor;
        atualizarCodigoFonte();
      }
    }

    // ATUALIZAR TEXTO
    function atualizarTexto(texto) {
      if (selectedElement) {
        selectedElement.textContent = texto;
        atualizarCodigoFonte();
      }
    }

    // ATUALIZAR CÓDIGO FONTE
    function atualizarCodigoFonte() {
      const preview = document.getElementById('previewContent');
      document.getElementById('codeInput').value = preview.innerHTML;
    }

    // COPIAR CÓDIGO
    function copiarCodigo() {
      const codigo = document.getElementById('codeInput').value;
      navigator.clipboard.writeText(codigo).then(() => {
        alert('✅ Código copiado para a área de transferência!');
      });
    }

    // SALVAR CÓDIGO
    function salvarCodigo() {
      const codigo = document.getElementById('codeInput').value;
      const blob = new Blob([codigo], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'codigo-editado.html';
      a.click();
    }

    // LIMPAR TUDO
    function limparTudo() {
      if (confirm('Tem certeza? Isso vai limpar tudo!')) {
        document.getElementById('codeInput').value = '';
        document.getElementById('previewContent').innerHTML = '';
        document.getElementById('propsContent').innerHTML = '<div class="no-selection">Clique em um elemento para editar suas propriedades</div>';
        selectedElement = null;
      }
    }

    // CONVERTER HEX PARA COLOR
    function hexToColor(rgb) {
      if (!rgb || rgb === 'rgba(0, 0, 0, 0)') return '#ffffff';
      
      const match = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
      if (!match) return '#ffffff';
      
      const hex = (x) => {
        return ("0" + parseInt(x).toString(16)).slice(-2);
      };
      
      return "#" + hex(match[1]) + hex(match[2]) + hex(match[3]);
    }

    // ATUALIZAR PREVIEW AO DIGITAR
    document.getElementById('codeInput').addEventListener('input', () => {
      renderizarPreview();
    });

    // EXEMPLO INICIAL
    document.getElementById('codeInput').value = `<div style="background: #f0f4f8; border-radius: 10px; padding: 20px; text-align: center;">
  <h2 style="color: #1a73e8;">🚀 Bem-vindo ao Editor Visual!</h2>
  <p style="color: #666;">Clique nos elementos para editar suas propriedades</p>
  <button style="padding: 10px 20px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer;">Clique aqui</button>
</div>`;

    renderizarPreview();
  </script>
</body>
</html>
