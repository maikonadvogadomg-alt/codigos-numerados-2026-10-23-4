<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Editor Visual</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Segoe UI', sans-serif;
  background: #1e1e1e;
  color: #eee;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* TOPO */
.topo {
  background: #2d2d2d;
  padding: 12px 16px;
  border-bottom: 3px solid #007acc;
  display: flex;
  gap: 8px;
  align-items: center;
}

.topo h1 {
  color: #007acc;
  font-size: 16px;
  flex: 1;
}

.btn {
  padding: 9px 16px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  font-size: 13px;
  color: white;
}

.btn-azul  { background: #007acc; }
.btn-azul:hover  { background: #005a9e; }
.btn-verde { background: #2e7d32; }
.btn-verde:hover { background: #1b5e20; }
.btn-laranja { background: #e65100; }
.btn-laranja:hover { background: #bf360c; }
.btn-vermelho { background: #c62828; }
.btn-vermelho:hover { background: #8b0000; }

/* CORPO - 3 COLUNAS */
.corpo {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* COLUNA ESQUERDA - CÓDIGO */
.col-codigo {
  width: 30%;
  display: flex;
  flex-direction: column;
  border-right: 2px solid #3e3e42;
}

.col-titulo {
  background: #2d2d2d;
  padding: 8px 12px;
  font-size: 11px;
  color: #aaa;
  border-bottom: 1px solid #3e3e42;
  font-weight: bold;
  text-transform: uppercase;
}

#codeInput {
  flex: 1;
  background: #1a1a1a;
  color: #d4d4d4;
  border: none;
  padding: 12px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  resize: none;
  overflow: auto;
}

#codeInput:focus { outline: none; }

/* COLUNA CENTRAL - PREVIEW */
.col-preview {
  flex: 1;
  display: flex;
  flex-direction: column;
  border-right: 2px solid #3e3e42;
}

.preview-area {
  flex: 1;
  background: white;
  overflow: auto;
}

#preview {
  padding: 20px;
  min-height: 100%;
}

/* COLUNA DIREITA - PROPRIEDADES */
.col-props {
  width: 280px;
  display: flex;
  flex-direction: column;
  background: #252526;
}

.props-area {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
}

/* PROPRIEDADES */
.grupo {
  margin-bottom: 14px;
  padding-bottom: 12px;
  border-bottom: 1px solid #3a3a3a;
}

.grupo-titulo {
  color: #007acc;
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.campo-label {
  color: #999;
  font-size: 11px;
  display: block;
  margin-bottom: 3px;
  margin-top: 8px;
}

.campo-input, .campo-select {
  width: 100%;
  background: #3a3a3a;
  color: #ddd;
  border: 1px solid #555;
  padding: 7px;
  border-radius: 4px;
  font-size: 12px;
  font-family: 'Courier New', monospace;
}

.campo-input:focus, .campo-select:focus {
  outline: none;
  border-color: #007acc;
  background: #1e1e1e;
}

.campo-cor {
  width: 100%;
  height: 34px;
  border: 1px solid #555;
  border-radius: 4px;
  cursor: pointer;
  margin-top: 3px;
}

.vazio {
  color: #666;
  text-align: center;
  padding: 30px 10px;
  font-size: 12px;
  line-height: 1.8;
}

/* HOVER NO PREVIEW */
.hover-el {
  outline: 1px dashed #007acc !important;
}

.selecionado {
  outline: 3px solid #007acc !important;
  outline-offset: 1px;
}

/* RODAPÉ */
.rodape {
  background: #007acc;
  padding: 5px 14px;
  font-size: 11px;
  color: white;
}

/* INPUT FILE INVISÍVEL */
#inputArquivo {
  display: none;
}

/* MODAL COLAR */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 999;
  align-items: center;
  justify-content: center;
}

.modal-bg.aberto {
  display: flex;
}

.modal-box {
  background: #2d2d2d;
  border: 2px solid #007acc;
  border-radius: 8px;
  padding: 20px;
  width: 600px;
  max-width: 95vw;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.modal-box h2 {
  color: #007acc;
  font-size: 15px;
}

#textoColar {
  background: #1a1a1a;
  color: #d4d4d4;
  border: 1px solid #555;
  padding: 12px;
  border-radius: 4px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  resize: vertical;
  min-height: 200px;
}

#textoColar:focus { outline: none; border-color: #007acc; }

.modal-btns {
  display: flex;
  gap: 10px;
}

.modal-btns button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  font-size: 13px;
  color: white;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #1e1e1e; }
::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
</style>
</head>
<body>

<!-- TOPO -->
<div class="topo">
  <h1>🎨 Editor Visual</h1>

  <!-- IMPORTAR: abre explorador de arquivos DE VERDADE -->
  <input type="file" id="inputArquivo" accept=".html,.htm,.txt" onchange="importarArquivo(event)">
  <button class="btn btn-azul" onclick="document.getElementById('inputArquivo').click()">
    📂 Importar Arquivo
  </button>

  <!-- COLAR: abre modal com textarea -->
  <button class="btn btn-azul" onclick="abrirColar()">
    📋 Colar Código
  </button>

  <!-- COPIAR -->
  <button class="btn btn-verde" onclick="copiarCodigo()">
    📄 Copiar Código
  </button>

  <!-- SALVAR -->
  <button class="btn btn-laranja" onclick="salvarArquivo()">
    💾 Salvar Arquivo
  </button>

  <!-- LIMPAR -->
  <button class="btn btn-vermelho" onclick="limpar()">
    🗑️ Limpar
  </button>
</div>

<!-- CORPO -->
<div class="corpo">

  <!-- CÓDIGO -->
  <div class="col-codigo">
    <div class="col-titulo">📝 Código HTML</div>
    <textarea id="codeInput" placeholder="O código aparece aqui..."></textarea>
  </div>

  <!-- PREVIEW -->
  <div class="col-preview">
    <div class="col-titulo">👁️ Preview — clique para editar</div>
    <div class="preview-area">
      <div id="preview"></div>
    </div>
  </div>

  <!-- PROPRIEDADES -->
  <div class="col-props">
    <div class="col-titulo">⚙️ Propriedades</div>
    <div class="props-area" id="propsArea">
      <div class="vazio">
        👆 Clique em qualquer<br>elemento no preview<br>para editar
      </div>
    </div>
  </div>

</div>

<!-- RODAPÉ -->
<div class="rodape" id="status">Pronto</div>

<!-- MODAL COLAR -->
<div class="modal-bg" id="modalColar">
  <div class="modal-box">
    <h2>📋 Cole seu código HTML aqui:</h2>
    <textarea id="textoColar" placeholder="Cole o código HTML aqui..."></textarea>
    <div class="modal-btns">
      <button style="background:#007acc" onclick="confirmarColar()">✅ Confirmar</button>
      <button style="background:#555" onclick="fecharColar()">❌ Cancelar</button>
    </div>
  </div>
</div>

<script>
let elSelecionado = null;

// ─── IMPORTAR ARQUIVO DE VERDADE ───────────────────────────────────────────
function importarArquivo(event) {
  const arquivo = event.target.files[0];
  if (!arquivo) return;

  const leitor = new FileReader();
  leitor.onload = function(e) {
    const conteudo = e.target.result;
    document.getElementById('codeInput').value = conteudo;
    renderizar();
    status(`✅ Arquivo importado: ${arquivo.name}`);
  };
  leitor.onerror = function() {
    status('❌ Erro ao ler o arquivo');
  };
  leitor.readAsText(arquivo, 'UTF-8');

  // Limpa o input pra poder importar o mesmo arquivo de novo se precisar
  event.target.value = '';
}

// ─── MODAL COLAR ───────────────────────────────────────────────────────────
function abrirColar() {
  document.getElementById('modalColar').classList.add('aberto');
  document.getElementById('textoColar').focus();
}

function fecharColar() {
  document.getElementById('modalColar').classList.remove('aberto');
}

function confirmarColar() {
  const codigo = document.getElementById('textoColar').value.trim();
  if (!codigo) {
    alert('⚠️ Cole algum código primeiro!');
    return;
  }
  document.getElementById('codeInput').value = codigo;
  document.getElementById('textoColar').value = '';
  fecharColar();
  renderizar();
  status('✅ Código colado com sucesso');
}

// Fechar modal com ESC
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharColar();
});

// ─── RENDERIZAR PREVIEW ────────────────────────────────────────────────────
function renderizar() {
  const codigo = document.getElementById('codeInput').value;
  const preview = document.getElementById('preview');
  preview.innerHTML = codigo;
  adicionarListeners(preview);
}

// Atualiza preview ao digitar no código
document.getElementById('codeInput').addEventListener('input', renderizar);

// ─── LISTENERS NO PREVIEW ─────────────────────────────────────────────────
function adicionarListeners(container) {
  container.querySelectorAll('*').forEach(el => {

    el.addEventListener('click', e => {
      e.stopPropagation();
      selecionar(el);
    });

    el.addEventListener('mouseover', e => {
      e.stopPropagation();
      if (el !== elSelecionado) el.classList.add('hover-el');
    });

    el.addEventListener('mouseout', e => {
      e.stopPropagation();
      el.classList.remove('hover-el');
    });
  });
}

// ─── SELECIONAR ELEMENTO ──────────────────────────────────────────────────
function selecionar(el) {
  if (elSelecionado) elSelecionado.classList.remove('selecionado');
  elSelecionado = el;
  el.classList.add('selecionado');
  mostrarProps(el);
  status(`Selecionado: <${el.tagName.toLowerCase()}>`);
}

// ─── MOSTRAR PROPRIEDADES ─────────────────────────────────────────────────
function mostrarProps(el) {
  const s = window.getComputedStyle(el);
  const area = document.getElementById('propsArea');

  area.innerHTML = `
    <div class="grupo">
      <div class="grupo-titulo">📍 Elemento: &lt;${el.tagName.toLowerCase()}&gt;</div>

      <label class="campo-label">ID</label>
      <input class="campo-input" value="${el.id||''}"
        onchange="el('id',this.value)">

      <label class="campo-label">Classe</label>
      <input class="campo-input" value="${el.className.replace('selecionado','').trim()||''}"
        onchange="el('className',this.value)">
    </div>

    <div class="grupo">
      <div class="grupo-titulo">🎨 Cores</div>

      <label class="campo-label">Cor do Texto</label>
      <input type="color" class="campo-cor"
        value="${hex(s.color)}"
        oninput="es('color',this.value)">

      <label class="campo-label">Cor de Fundo</label>
      <input type="color" class="campo-cor"
        value="${hex(s.backgroundColor)}"
        oninput="es('backgroundColor',this.value)">
    </div>

    <div class="grupo">
      <div class="grupo-titulo">📏 Tamanho</div>

      <label class="campo-label">Largura</label>
      <input class="campo-input" value="${el.style.width||''}"
        placeholder="ex: 200px ou 50%"
        onchange="es('width',this.value)">

      <label class="campo-label">Altura</label>
      <input class="campo-input" value="${el.style.height||''}"
        placeholder="ex: 100px"
        onchange="es('height',this.value)">
    </div>

    <div class="grupo">
      <div class="grupo-titulo">🔤 Texto</div>

      <label class="campo-label">Tamanho da Fonte</label>
      <input class="campo-input" value="${el.style.fontSize||''}"
        placeholder="ex: 16px"
        onchange="es('fontSize',this.value)">

      <label class="campo-label">Peso</label>
      <select class="campo-select" onchange="es('fontWeight',this.value)">
        <option value="normal">Normal</option>
        <option value="bold">Bold</option>
        <option value="600">600</option>
        <option value="700">700</option>
        <option value="800">800</option>
      </select>

      <label class="campo-label">Alinhamento</label>
      <select class="campo-select" onchange="es('textAlign',this.value)">
        <option value="left">Esquerda</option>
        <option value="center">Centro</option>
        <option value="right">Direita</option>
        <option value="justify">Justificado</option>
      </select>
    </div>

    <div class="grupo">
      <div class="grupo-titulo">📦 Espaçamento</div>

      <label class="campo-label">Padding</label>
      <input class="campo-input" value="${el.style.padding||''}"
        placeholder="ex: 10px ou 10px 20px"
        onchange="es('padding',this.value)">

      <label class="campo-label">Margin</label>
      <input class="campo-input" value="${el.style.margin||''}"
        placeholder="ex: 10px"
        onchange="es('margin',this.value)">

      <label class="campo-label">Borda</label>
      <input class="campo-input" value="${el.style.border||''}"
        placeholder="ex: 1px solid #000"
        onchange="es('border',this.value)">

      <label class="campo-label">Border Radius</label>
      <input class="campo-input" value="${el.style.borderRadius||''}"
        placeholder="ex: 8px"
        onchange="es('borderRadius',this.value)">
    </div>

    <div class="grupo">
      <div class="grupo-titulo">✏️ Conteúdo</div>

      <label class="campo-label">Texto do elemento</label>
      <textarea class="campo-input" style="height:70px;resize:vertical"
        onchange="atualizarTexto(this.value)">${el.innerText||''}</textarea>
    </div>
  `;
}

// ─── ATALHOS PARA ATUALIZAR ───────────────────────────────────────────────
function es(prop, val) {
  if (!elSelecionado) return;
  elSelecionado.style[prop] = val;
  sincronizarCodigo();
}

function el(prop, val) {
  if (!elSelecionado) return;
  elSelecionado[prop] = val;
  sincronizarCodigo();
}

function atualizarTexto(val) {
  if (!elSelecionado) return;
  elSelecionado.innerText = val;
  sincronizarCodigo();
}

// ─── SINCRONIZAR CÓDIGO ───────────────────────────────────────────────────
function sincronizarCodigo() {
  const preview = document.getElementById('preview');
  const clone = preview.cloneNode(true);
  // remove classes de edição
  clone.querySelectorAll('.selecionado, .hover-el').forEach(e => {
    e.classList.remove('selecionado', 'hover-el');
  });
  document.getElementById('codeInput').value = clone.innerHTML;
}

// ─── COPIAR CÓDIGO ────────────────────────────────────────────────────────
function copiarCodigo() {
  const codigo = document.getElementById('codeInput').value;
  navigator.clipboard.writeText(codigo)
    .then(() => status('✅ Código copiado!'))
    .catch(() => status('❌ Erro ao copiar'));
}

// ─── SALVAR ARQUIVO ───────────────────────────────────────────────────────
function salvarArquivo() {
  const codigo = document.getElementById('codeInput').value;
  const blob = new Blob([codigo], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'codigo-editado.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  status('✅ Arquivo salvo!');
}

// ─── LIMPAR ───────────────────────────────────────────────────────────────
function limpar() {
  if (!confirm('Limpar tudo?')) return;
  document.getElementById('codeInput').value = '';
  document.getElementById('preview').innerHTML = '';
  document.getElementById('propsArea').innerHTML =
    '<div class="vazio">👆 Clique em qualquer<br>elemento no preview<br>para editar</div>';
  elSelecionado = null;
  status('Limpo');
}

// ─── STATUS ───────────────────────────────────────────────────────────────
function status(msg) {
  document.getElementById('status').textContent = msg;
}

// ─── RGB → HEX ────────────────────────────────────────────────────────────
function hex(rgb) {
  if (!rgb || rgb === 'rgba(0, 0, 0, 0)' || rgb === 'transparent') return '#ffffff';
  const m = rgb.match(/\d+/g);
  if (!m || m.length < 3) return '#ffffff';
  return '#' + m.slice(0,3).map(x =>
    parseInt(x).toString(16).padStart(2,'0')
  ).join('');
}

// ─── EXEMPLO INICIAL ──────────────────────────────────────────────────────
document.getElementById('codeInput').value =
`<div style="background:#f0f4f8;border-radius:10px;padding:30px;text-align:center;max-width:500px;margin:20px auto;">
  <h2 style="color:#1a73e8;margin-bottom:10px;">🚀 Editor Visual</h2>
  <p style="color:#666;margin-bottom:20px;">Clique nos elementos para editar</p>
  <button style="padding:10px 24px;background:#1a73e8;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">
    Botão de Exemplo
  </button>
</div>`;

renderizar();
</script>
</body>
</html>
