<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Analisador Profissional de Projetos - Importar, Analisar e Exportar">
    <meta name="theme-color" content="#667eea">
    <title>Analisador de Projetos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="sidebar-close-mobile" id="sidebarCloseMobile">✕</button>
                <h1>🔍 Analisador</h1>
                <p>De Projetos</p>
            </div>

            <nav class="sidebar-menu" id="sidebarMenu">
                <div class="menu-item active" data-page="upload">
                    <span class="menu-icon">📤</span>
                    <span class="menu-text">Upload</span>
                </div>
                <div class="menu-item" data-page="analise">
                    <span class="menu-icon">📊</span>
                    <span class="menu-text">Análise</span>
                </div>
                <div class="menu-item" data-page="estrutura">
                    <span class="menu-icon">🏗️</span>
                    <span class="menu-text">Estrutura</span>
                </div>
                <div class="menu-item" data-page="terminal">
                    <span class="menu-icon">💻</span>
                    <span class="menu-text">Terminal</span>
                </div>
                <div class="menu-item" data-page="exportar">
                    <span class="menu-icon">📥</span>
                    <span class="menu-text">Exportar</span>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="connection-status">
                    <div class="status-dot"></div>
                    <span id="statusText">Pronto</span>
                </div>
            </div>
        </aside>

        <!-- OVERLAY MOBILE -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- CONTEÚDO PRINCIPAL -->
        <div class="main-content">
            <!-- TOPBAR -->
            <header class="topbar">
                <button class="menu-toggle-mobile" id="menuToggle">☰</button>
                <h2 class="topbar-title" id="pageTitle">Upload de Projeto</h2>
                <div class="topbar-actions">
                    <button class="btn btn-secondary btn-small" id="limparBtn" onclick="limparProjeto()">
                        🗑️
                    </button>
                </div>
            </header>

            <!-- ÁREA DE CONTEÚDO -->
            <div class="content-area" id="contentArea"></div>
        </div>
    </div>

    <!-- MODAL NOMEAÇÃO DE ARQUIVO -->
    <div class="modal" id="nomeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">📝 Nomear Arquivo</h2>
                <button class="close-btn" onclick="fecharModal('nomeModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="nomeArquivo">Nome do Arquivo:</label>
                    <input type="text" id="nomeArquivo" placeholder="Ex: utils.js, styles.css">
                </div>
                <div class="form-group">
                    <label for="tipoModulo">Tipo de Módulo:</label>
                    <select id="tipoModulo">
                        <option value="arquivo">Arquivo Simples</option>
                        <option value="componente">Componente</option>
                        <option value="utilitario">Utilitário</option>
                        <option value="servico">Serviço</option>
                        <option value="modelo">Modelo/Schema</option>
                        <option value="config">Configuração</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="descricaoArquivo">Descrição (opcional):</label>
                    <textarea id="descricaoArquivo" placeholder="Descreva o propósito do arquivo"></textarea>
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="confirmarNomeArquivo()">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL NOMEAÇÃO DE PROJETO -->
    <div class="modal" id="projetoModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">📁 Nomear Projeto</h2>
                <button class="close-btn" onclick="fecharModal('projetoModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="nomeProjeto">Nome do Projeto:</label>
                    <input type="text" id="nomeProjeto" placeholder="Ex: Meu Sistema Jurídico">
                </div>
                <div class="form-group">
                    <label for="descricaoProjeto">Descrição:</label>
                    <textarea id="descricaoProjeto" placeholder="Descrição do projeto"></textarea>
                </div>
                <div class="form-group">
                    <label for="tipoProjeto">Tipo de Projeto:</label>
                    <select id="tipoProjeto">
                        <option value="web">Aplicação Web</option>
                        <option value="mobile">Aplicação Mobile</option>
                        <option value="desktop">Aplicação Desktop</option>
                        <option value="pwa">PWA</option>
                        <option value="biblioteca">Biblioteca/Módulo</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
                <button class="btn btn-primary" style="width: 100%; margin-top: 20px;" onclick="confirmarNomeProjeto()">
                    Confirmar
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL VISUALIZAR CÓDIGO -->
    <div class="modal" id="codigoModal">
        <div class="modal-content" style="max-width: 800px;">
            <div class="modal-header">
                <h2 class="modal-title" id="codigoModalTitle">Visualizar Código</h2>
                <button class="close-btn" onclick="fecharModal('codigoModal')">✕</button>
            </div>
            <div class="modal-body">
                <pre id="codigoPreview" style="background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 5px; overflow-x: auto; max-height: 400px;"></pre>
            </div>
        </div>
    </div>

    <style>
/* ============================================

    <script>
// ============================================
// CONFIGURAÇÃO GLOBAL
// ============================================
const CONFIG = {
    currentPage: 'upload',
    projeto: {
        nome: '',
        descricao: '',
        tipo: 'web',
        arquivos: [],
        estrutura: {}
    },
    arquivoEmEdicao: null
};

// ============================================
// INICIALIZAÇÃO
// ============================================
document.addEventListener('DOMContentLoaded', () => {
    setupEventListeners();
    carregarPagina('upload');
});

function setupEventListeners() {
    // Menu items
    document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', () => {
            const page = item.dataset.page;
            mudarPagina(page);
        });
    });

    // Menu toggle mobile
    document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    });

    document.getElementById('sidebarCloseMobile').addEventListener('click', () => {
        document.getElementById('sidebar').classList.remove('active');
        document.getElementById('sidebarOverlay').classList.remove('active');
    });

    document.getElementById('sidebarOverlay').addEventListener('click', () => {
        document.getElementById('sidebar').classList.remove('active');
        document.getElementById('sidebarOverlay').classList.remove('active');
    });
}

// ============================================
// GERENCIAMENTO DE PÁGINAS
// ============================================
function mudarPagina(page) {
    CONFIG.currentPage = page;
    
    document.querySelectorAll('.menu-item').forEach(item => {
        item.classList.remove('active');
        if (item.dataset.page === page) {
            item.classList.add('active');
        }
    });

    carregarPagina(page);
}

function carregarPagina(page) {
    const titles = {
        upload: 'Upload de Projeto',
        analise: 'Análise de Arquivos',
        estrutura: 'Estrutura do Projeto',
        terminal: 'Comandos Terminal',
        exportar: 'Exportar Projeto'
    };

    document.getElementById('pageTitle').textContent = titles[page] || 'Página';
    document.getElementById('contentArea').innerHTML = '<div class="spinner"></div>';

    setTimeout(() => {
        let conteudo = '';
        switch(page) {
            case 'upload':
                conteudo = renderUpload();
                break;
            case 'analise':
                conteudo = renderAnalise();
                break;
            case 'estrutura':
                conteudo = renderEstrutura();
                break;
            case 'terminal':
                conteudo = renderTerminal();
                break;
            case 'exportar':
                conteudo = renderExportar();
                break;
        }
        document.getElementById('contentArea').innerHTML = conteudo;
    }, 300);
}

// ============================================
// RENDERIZADORES
// ============================================
function renderUpload() {
    return `
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">📤 Importar Projeto</h3>
            </div>
            <div class="card-body">
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <h3>📁 Arraste arquivos aqui ou clique</h3>
                    <p>Suporta: ZIP, arquivos individuais, ou cole código</p>
                    <p style="font-size: 0.9em; color: #666;">Máximo 50MB</p>
                </div>
                <input type="file" id="fileInput" multiple accept=".zip,.js,.html,.css,.json,.md,.txt,.py,.java,.cpp,.ts,.jsx,.tsx,.vue">
                
                <div style="margin-top: 30px;">
                    <h4 style="margin-bottom: 15px;">Ou Cole Código Aqui:</h4>
                    <textarea id="codeInput" placeholder="Cole seu código aqui..." style="width: 100%; height: 200px; padding: 10px; border: 1px solid var(--border); border-radius: 5px; font-family: 'Courier New', monospace; font-size: 0.9em;"></textarea>
                    <button class="btn btn-primary" style="margin-top: 10px;" onclick="adicionarCodigoColado()">
                        ➕ Adicionar Código
                    </button>
                </div>
            </div>
        </div>

        ${CONFIG.projeto.arquivos.length > 0 ? `

const uploadArea = document.querySelector('.upload-area');
if (uploadArea) {
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        processarArquivos(e.dataTransfer.files);
    });
}

document.addEventListener('change', (e) => {
    if (e.target.id === 'fileInput') {
        processarArquivos(e.target.files);
    }
});

function processarArquivos(files) {
    Array.from(files).forEach(file => {
        if (file.name.endsWith('.zip')) {
            processarZip(file);
        } else {
            processarArquivoSimples(file);
        }
    });
}

function processarArquivoSimples(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const conteudo = e.target.result;
        const tipo = detectarTipo(file.name);
        const linhas = conteudo.split('\n').length;

        CONFIG.projeto.arquivos.push({
            nome: file.name,
            conteudo: conteudo,
            tipo: tipo,
            tamanho: file.size,
            linhas: linhas,
            descricao: ''
        });

        mostrarAlerta('✅ Arquivo adicionado: ' + file.name, 'success');
        carregarPagina('upload');
    };
    reader.readAsText(file);
}

function processarZip(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const zip = new JSZip();
            const conteudo = await zip.loadAsync(e.target.result);

            for (const [path, file] of Object.entries(conteudo.files)) {
                if (!file.dir && !path.includes('node_modules') && !path.includes('.git')) {
                    const dados = await file.async('string');
                    const nome = path.split('/').pop();
                    const tipo = detectarTipo(nome);
                    const linhas = dados.split('\n').length;

                    CONFIG.projeto.arquivos.push({
                        nome: nome,
                        caminho: path,
                        conteudo: dados,
                        tipo: tipo,
                        tamanho: dados.length,
                        linhas: linhas,
                        descricao: ''
                    });
                }
            }

            mostrarAlerta('✅ ZIP extraído: ' + CONFIG.projeto.arquivos.length + ' arquivos', 'success');
            carregarPagina('upload');
        } catch (erro) {
            mostrarAlerta('❌ Erro ao processar ZIP: ' + erro.message, 'error');
        }
    };
    reader.readAsArrayBuffer(file);
}

function analisarProjeto() {
    const analise = {
        totalArquivos: CONFIG.projeto.arquivos.length,
        totalLinhas: 0,
        tamanhoTotal: 0,
        linguagens: {},
        tiposArquivo: {}
    };

    CONFIG.projeto.arquivos.forEach(arquivo => {
        analise.totalLinhas += arquivo.linhas || 0;
        analise.tamanhoTotal += arquivo.tamanho || 0;

        const extensao = arquivo.nome.split('.').pop();
        if (!analise.tiposArquivo[extensao]) {
            analise.tiposArquivo[extensao] = { extensao, quantidade: 0, tamanho: 0 };
        }
        analise.tiposArquivo[extensao].quantidade++;
        analise.tiposArquivo[extensao].tamanho += arquivo.tamanho || 0;

        const linguagem = detectarLinguagem(arquivo.nome);
        if (!analise.linguagens[linguagem]) {
            analise.linguagens[linguagem] = 0;
        }
        analise.linguagens[linguagem]++;
    });

    analise.linguagens = Object.entries(analise.linguagens).map(([nome, arquivos]) => ({ nome, arquivos }));
    analise.tiposArquivo = Object.values(analise.tiposArquivo);

    return analise;
}

function gerarEstrutura() {
    let estrutura = `${CONFIG.projeto.nome || 'projeto'}/\n`;
    
    CONFIG.projeto.arquivos.forEach(arquivo => {
        const caminho = arquivo.caminho || arquivo.nome;
        const linhas = '│   '.repeat(caminho.split('/').length - 1);
        estrutura += `${linhas}├── ${arquivo.nome}\n`;
    });

    return estrutura;
}

function gerarComandosTerminal() {
    const nomeProjeto = CONFIG.projeto.nome.toLowerCase().replace(/\s+/g, '-');
    
    const estrutura = `mkdir -p ${nomeProjeto}
cd ${nomeProjeto}`;

    const criacao = CONFIG.projeto.arquivos.map(arquivo => {
        const caminho = arquivo.caminho || arquivo.nome;
        const dirs = caminho.split('/').slice(0, -1);
        let cmd = '';
        if (dirs.length > 0) {
            cmd += `mkdir -p ${dirs.join('/')}\n`;
        }
        cmd += `touch ${caminho}`;
        return cmd;
    }).join('\n');

    const script = `#!/bin/bash
# Script de inicialização para ${CONFIG.projeto.nome}

echo "Criando estrutura de projeto..."

${estrutura}

${criacao}

echo "✅ Projeto criado com sucesso!"`;

    return { estrutura, criacao, script };
}

function detectarTipo(nome) {
    const extensao = nome.split('.').pop().toLowerCase();
    const tipos = {
        'js': 'JavaScript',
        'ts': 'TypeScript',
        'jsx': 'React',
        'tsx': 'React TS',
        'vue': 'Vue',
        'html': 'HTML',
        'css': 'CSS',
        'scss': 'SCSS',
        'json': 'JSON',
        'md': 'Markdown',
        'py': 'Python',
        'java': 'Java',
        'cpp': 'C++',
        'c': 'C',
        'txt': 'Texto'
    };
    return tipos[extensao] || 'Outro';
}

function detectarLinguagem(nome) {
    const extensao = nome.split('.').pop().toLowerCase();
    const linguagens = {
        'js': 'JavaScript',
        'ts': 'TypeScript',
        'jsx': 'React',
        'tsx': 'React',
        'vue': 'Vue',
        'html': 'HTML',
        'css': 'CSS',
        'scss': 'SCSS',
        'json': 'JSON',
        'md': 'Markdown',
        'py': 'Python',
        'java': 'Java',
        'cpp': 'C++',
        'c': 'C'
    };
    return linguagens[extensao] || 'Outro';
}

function formatarTamanho(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const tamanhos = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + tamanhos[i];
}

function baixarArquivo(blob, nome) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nome;
    a.click();
    URL.revokeObjectURL(url);
}

function mostrarAlerta(mensagem, tipo = 'info') {
    const alertDiv = document.createElement('div');
    alertDiv.className = `alert alert-${tipo}`;
    alertDiv.innerHTML = `<span>${mensagem}</span>`;
    
    const contentArea = document.getElementById('contentArea');
    contentArea.insertBefore(alertDiv, contentArea.firstChild);

    setTimeout(() => alertDiv.remove(), 4000);
}

function visualizarCodigo(index) {
    const arquivo = CONFIG.projeto.arquivos[index];
    document.getElementById('codigoModalTitle').textContent = arquivo.nome;
    document.getElementById('codigoPreview').textContent = arquivo.conteudo;
    abrirModal('codigoModal');
}

function editarArquivo(index) {
    CONFIG.arquivoEmEdicao = CONFIG.projeto.arquivos[index];
    abrirModalNomeArquivo();
}

function removerArquivo(index) {
    if (confirm('Remover arquivo?')) {
        CONFIG.projeto.arquivos.splice(index, 1);
        mostrarAlerta('🗑️ Arquivo removido!', 'info');
        carregarPagina('upload');
    }
}

function limparProjeto() {
    if (confirm('Limpar todo o projeto?')) {
        CONFIG.projeto = {
            nome: '',
            descricao: '',
            tipo: 'web',
            arquivos: [],
            estrutura: {}
        };
        mostrarAlerta('🗑️ Projeto limpo!', 'info');
        carregarPagina('upload');
    }
}

// ============================================
// FUNÇÕES DE CÓPIA E DOWNLOAD
// ============================================
function copiarEstrutura() {
    const estrutura = gerarEstrutura();
    navigator.clipboard.writeText(estrutura);
    mostrarAlerta('📋 Estrutura copiada!', 'success');
}

function copiarTodosComandos() {
    const comandos = gerarComandosTerminal();
    const texto = `${comandos.estrutura}\n\n${comandos.criacao}`;
    navigator.clipboard.writeText(texto);
    mostrarAlerta('📋 Comandos copiados!', 'success');
}

function baixarScript() {
    const comandos = gerarComandosTerminal();
    const blob = new Blob([comandos.script], { type: 'text/plain' });
    baixarArquivo(blob, 'init.sh');
    mostrarAlerta('📥 Script baixado!', 'success');
}
