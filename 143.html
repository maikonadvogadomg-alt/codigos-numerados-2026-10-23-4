<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK-Master — Editor + Chat + Prompt Generator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e27;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* ═══ SIDEBAR ═══ */
    .sidebar {
      width: 280px;
      background: #0f1419;
      border-right: 1px solid #1e2139;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #1e2139;
      background: #0a0e27;
    }

    .sidebar-title {
      font-size: 12px;
      font-weight: 700;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sidebar-content {
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-btn {
      padding: 12px;
      background: transparent;
      border: 1px solid #1e2139;
      border-radius: 6px;
      color: #c9d1d9;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
      text-align: left;
    }

    .sidebar-btn:hover {
      background: #161b22;
      border-color: #3b82f6;
      color: #58a6ff;
    }

    .sidebar-btn.active {
      background: #1f6feb;
      border-color: #1f6feb;
      color: white;
    }

    /* ═══ MAIN CONTENT ═══ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #0a0e27;
    }

    .header {
      padding: 16px;
      background: #0f1419;
      border-bottom: 1px solid #1e2139;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #c9d1d9;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid #1e2139;
      border-radius: 6px;
      color: #8b949e;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: #161b22;
      border-color: #3b82f6;
      color: #58a6ff;
    }

    .content {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ═══ EDITOR ═══ */
    .editor-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1e2139;
    }

    .editor-header {
      padding: 12px 16px;
      background: #0f1419;
      border-bottom: 1px solid #1e2139;
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .editor-content {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .editor-textarea {
      flex: 1;
      padding: 16px;
      background: #0a0e27;
      border: none;
      color: #c9d1d9;
      font-family: "Monaco", "Courier New", monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }

    .editor-textarea:focus {
      outline: none;
    }

    .editor-footer {
      padding: 12px 16px;
      background: #0f1419;
      border-top: 1px solid #1e2139;
      font-size: 11px;
      color: #8b949e;
      display: flex;
      justify-content: space-between;
    }

    /* ═══ CHAT SECTION ═══ */
    .chat-section {
      width: 380px;
      display: flex;
      flex-direction: column;
      background: #0f1419;
    }

    .chat-header {
      padding: 12px 16px;
      background: #0a0e27;
      border-bottom: 1px solid #1e2139;
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .message {
      display: flex;
      gap: 8px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.assistant .message-content {
      background: #161b22;
      border: 1px solid #1e2139;
      color: #c9d1d9;
    }

    .message.user .message-content {
      background: #1f6feb;
      color: white;
    }

    .chat-input {
      padding: 12px;
      background: #0a0e27;
      border-top: 1px solid #1e2139;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-controls {
      display: flex;
      gap: 6px;
    }

    .chat-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: 1px solid #1e2139;
      border-radius: 4px;
      color: #8b949e;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .chat-btn:hover {
      background: #161b22;
      border-color: #3b82f6;
      color: #58a6ff;
    }

    .chat-input-area {
      display: flex;
      gap: 6px;
    }

    .chat-textarea {
      flex: 1;
      padding: 8px 10px;
      background: #161b22;
      border: 1px solid #1e2139;
      border-radius: 4px;
      color: #c9d1d9;
      font-size: 12px;
      font-family: inherit;
      resize: none;
      max-height: 80px;
    }

    .chat-textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(31, 110, 251, 0.1);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      background: #1f6feb;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .send-btn:hover {
      background: #388bfd;
    }

    /* ═══ MODAL ═══ */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: #0f1419;
      border: 1px solid #1e2139;
      border-radius: 8px;
      padding: 24px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
      color: #c9d1d9;
    }

    .modal-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 600;
      color: #8b949e;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input,
    .form-textarea {
      padding: 10px 12px;
      background: #0a0e27;
      border: 1px solid #1e2139;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 12px;
      font-family: inherit;
    }

    .form-textarea {
      resize: vertical;
      min-height: 100px;
    }

    .form-input:focus,
    .form-textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(31, 110, 251, 0.1);
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-btn.primary {
      background: #1f6feb;
      color: white;
    }

    .modal-btn.primary:hover {
      background: #388bfd;
    }

    .modal-btn.secondary {
      background: transparent;
      border: 1px solid #1e2139;
      color: #8b949e;
    }

    .modal-btn.secondary:hover {
      border-color: #3b82f6;
      color: #c9d1d9;
    }

    .modal-btn.danger {
      background: #da3633;
      color: white;
    }

    .modal-btn.danger:hover {
      background: #f85149;
    }

    /* ═══ SCROLLBAR ═══ */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #1e2139;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #30363d;
    }

    .hidden {
      display: none;
    }

    .recording {
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">🚀 SK-Master</div>
      </div>
      <div class="sidebar-content">
        <button class="sidebar-btn active" onclick="switchTab('editor')">📝 Editor</button>
        <button class="sidebar-btn" onclick="switchTab('database')">💾 Database</button>
        <button class="sidebar-btn" onclick="switchTab('rules')">⚙️ Regras</button>
        <button class="sidebar-btn" onclick="openPromptGenerator()">🎯 Gerar Prompt</button>
        <button class="sidebar-btn" onclick="exportProject()">📤 Exportar</button>
      </div>
    </div>

    <!-- MAIN -->
    <div class="main">
      <div class="header">
        <div class="header-title" id="headerTitle">📝 Editor de Projeto</div>
        <div class="header-actions">
          <button class="btn-icon" title="Salvar" onclick="saveProject()">💾</button>
          <button class="btn-icon" title="Limpar" onclick="clearEditor()">🗑️</button>
        </div>
      </div>

      <div class="content">
        <!-- EDITOR -->
        <div class="editor-section" id="editorTab">
          <div class="editor-header">Código / Projeto</div>
          <div class="editor-content">
            <textarea id="editorTextarea" class="editor-textarea" placeholder="Cole seu projeto aqui ou comece a escrever..."></textarea>
          </div>
          <div class="editor-footer" id="editorFooter">0 caracteres</div>
        </div>

        <!-- DATABASE -->
        <div class="editor-section hidden" id="databaseTab">
          <div class="editor-header">Base de Dados</div>
          <div class="editor-content">
            <textarea id="databaseTextarea" class="editor-textarea" placeholder="Defina sua base de dados aqui (JSON, SQL, etc)..."></textarea>
          </div>
          <div class="editor-footer">Base de dados</div>
        </div>

        <!-- RULES -->
        <div class="editor-section hidden" id="rulesTab">
          <div class="editor-header">Regras da IA</div>
          <div class="editor-content">
            <textarea id="rulesTextarea" class="editor-textarea" placeholder="Defina as regras que a IA deve seguir..."></textarea>
          </div>
          <div class="editor-footer">Regras definidas</div>
        </div>

        <!-- CHAT -->
        <div class="chat-section">
          <div class="chat-header">💬 Chat com IA</div>
          <div class="messages" id="messagesList"></div>
          <div class="chat-input">
            <div class="chat-controls">
              <button class="chat-btn" id="recordBtn" onclick="toggleRecording()" title="Gravar áudio">🎤 Gravar</button>
              <button class="chat-btn" onclick="searchInternet()" title="Pesquisar na internet">🔍 Buscar</button>
            </div>
            <div class="chat-input-area">
              <textarea id="chatInput" class="chat-textarea" placeholder="Digite ou fale..."></textarea>
              <button class="send-btn" onclick="sendChatMessage()">📤</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: GERAR PROMPT -->
  <div class="modal" id="promptModal">
    <div class="modal-content">
      <div class="modal-title">🎯 Gerador de Prompt Final</div>
      <div class="modal-form">
        <div class="form-group">
          <label class="form-label">Descrição do Projeto</label>
          <textarea id="promptDesc" class="form-textarea" placeholder="O que você quer fazer?"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Problemas / Feedback</label>
          <textarea id="promptFeedback" class="form-textarea" placeholder="O que está bom? O que está ruim?"></textarea>
        </div>
      </div>
      <div style="background: #161b22; border: 1px solid #1e2139; border-radius: 6px; padding: 12px; max-height: 300px; overflow-y: auto;">
        <div style="font-size: 11px; font-weight: 600; color: #8b949e; margin-bottom: 8px; text-transform: uppercase;">Prompt Final Gerado:</div>
        <div id="promptOutput" style="font-size: 12px; color: #c9d1d9; line-height: 1.6; white-space: pre-wrap; word-break: break-word;"></div>
      </div>
      <div class="modal-buttons">
        <button class="modal-btn secondary" onclick="closePromptModal()">Fechar</button>
        <button class="modal-btn primary" onclick="copyPrompt()">📋 Copiar</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY_PROJECT = "sk-master-project";
    const STORAGE_KEY_CHAT = "sk-master-chat";

    let currentTab = "editor";
    let messages = [];
    let isRecording = false;
    let mediaRecorder;
    let audioChunks = [];

    // ═══════════════════════════════════════════════════════════════
    // TABS
    // ═══════════════════════════════════════════════════════════════

    function switchTab(tab) {
      currentTab = tab;
      
      // Hide all tabs
      document.getElementById("editorTab").classList.add("hidden");
      document.getElementById("databaseTab").classList.add("hidden");
      document.getElementById("rulesTab").classList.add("hidden");

      // Show selected tab
      document.getElementById(tab + "Tab").classList.remove("hidden");

      // Update header
      const titles = {
        editor: "📝 Editor de Projeto",
        database: "💾 Base de Dados",
        rules: "⚙️ Regras da IA"
      };
      document.getElementById("headerTitle").textContent = titles[tab];

      // Update sidebar
      document.querySelectorAll(".sidebar-btn").forEach(btn => btn.classList.remove("active"));
      event.target.classList.add("active");
    }

    // ═══════════════════════════════════════════════════════════════
    // EDITOR
    // ═══════════════════════════════════════════════════════════════

    function saveProject() {
      const editor = document.getElementById("editorTextarea").value;
      const database = document.getElementById("databaseTextarea").value;
      const rules = document.getElementById("rulesTextarea").value;

      const project = { editor, database, rules, timestamp: new Date().toLocaleString("pt-BR") };
      localStorage.setItem(STORAGE_KEY_PROJECT, JSON.stringify(project));
      alert("✅ Projeto salvo!");
    }

    function clearEditor() {
      if (confirm("Limpar tudo?")) {
        document.getElementById("editorTextarea").value = "";
        document.getElementById("databaseTextarea").value = "";
        document.getElementById("rulesTextarea").value = "";
        localStorage.removeItem(STORAGE_KEY_PROJECT);
      }
    }

    function exportProject() {
      const editor = document.getElementById("editorTextarea").value;
      const database = document.getElementById("databaseTextarea").value;
      const rules = document.getElementById("rulesTextarea").value;

      const content = `
=== SK-MASTER PROJECT ===
Data: ${new Date().toLocaleString("pt-BR")}

--- EDITOR ---
${editor}

--- DATABASE ---
${database}

--- RULES ---
${rules}
      `;

      const blob = new Blob([content], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "sk-project.txt";
      a.click();
    }

    function loadProject() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_PROJECT);
        if (saved) {
          const project = JSON.parse(saved);
          document.getElementById("editorTextarea").value = project.editor || "";
          document.getElementById("databaseTextarea").value = project.database || "";
          document.getElementById("rulesTextarea").value = project.rules || "";
        }
      } catch (e) {
        console.error("Erro ao carregar projeto:", e);
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // CHAT
    // ═══════════════════════════════════════════════════════════════

    function loadMessages() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_CHAT);
        messages = saved ? JSON.parse(saved) : [];
      } catch {
        messages = [];
      }
      renderMessages();
    }

    function saveMessages() {
      localStorage.setItem(STORAGE_KEY_CHAT, JSON.stringify(messages));
    }

    function sendChatMessage() {
      const input = document.getElementById("chatInput");
      const text = input.value.trim();

      if (!text) return;

      messages.push({
        role: "user",
        content: text,
        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
      });

      input.value = "";
      saveMessages();
      renderMessages();

      // Simula resposta
      setTimeout(() => {
        const rules = document.getElementById("rulesTextarea").value || "Sem regras definidas";
        const response = `Entendi! Seguindo as regras:\n\n${rules}\n\nVocê disse: "${text}"\n\nResposta simulada. Integre com Claude/OpenAI para respostas reais.`;

        messages.push({
          role: "assistant",
          content: response,
          timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
        });

        saveMessages();
        renderMessages();
      }, 500);
    }

    function renderMessages() {
      const container = document.getElementById("messagesList");
      container.innerHTML = messages
        .map(
          (msg) => `
        <div class="message ${msg.role}">
          <div class="message-content">${msg.content.replace(/\n/g, "<br>")}</div>
        </div>
      `
        )
        .join("");
      container.scrollTop = container.scrollHeight;
    }

    // ═══════════════════════════════════════════════════════════════
    // ÁUDIO
    // ═══════════════════════════════════════════════════════════════

    async function toggleRecording() {
      const btn = document.getElementById("recordBtn");

      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: "audio/wav" });
            // Aqui você pode enviar para um serviço de speech-to-text
            console.log("Áudio gravado:", audioBlob);
            alert("🎤 Áudio gravado! (Integre com speech-to-text)");
          };

          mediaRecorder.start();
          isRecording = true;
          btn.classList.add("recording");
          btn.textContent = "⏹️ Parar";
        } catch (e) {
          alert("❌ Erro ao acessar microfone: " + e.message);
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        btn.classList.remove("recording");
        btn.textContent = "🎤 Gravar";
      }
    }

    // ═══════════════════════════════════════════════════════════════
    // PROMPT GENERATOR
    // ═══════════════════════════════════════════════════════════════

    function openPromptGenerator() {
      const editor = document.getElementById("editorTextarea").value;
      const database = document.getElementById("databaseTextarea").value;
      const rules = document.getElementById("rulesTextarea").value;

      const prompt = `
=== CONTEXTO DO PROJETO ===

**Projeto:**
${editor || "Nenhum projeto definido"}

**Base de Dados:**
${database || "Nenhuma base de dados definida"}

**Regras da IA:**
${rules || "Nenhuma regra definida"}

=== INSTRUÇÕES ===

1. Analise o projeto acima
2. Identifique o que está bom
3. Identifique o que está ruim
4. Sugira melhorias

Responda de forma estruturada e profissional.
      `;

      document.getElementById("promptOutput").textContent = prompt;
      document.getElementById("promptModal").classList.add("open");
    }

    function closePromptModal() {
      document.getElementById("promptModal").classList.remove("open");
    }

    function copyPrompt() {
      const text = document.getElementById("promptOutput").textContent;
      navigator.clipboard.writeText(text).then(() => {
        alert("✅ Prompt copiado!");
      });
    }

    // ═══════════════════════════════════════════════════════════════
    // BUSCA NA INTERNET (simulada)
    // ═══════════════════════════════════════════════════════════════

    function searchInternet() {
      const query = document.getElementById("chatInput").value.trim();
      if (!query) {
        alert("Digite o que deseja buscar!");
        return;
      }

      messages.push({
        role: "user",
        content: `🔍 Buscar: ${query}`,
        timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
      });

      setTimeout(() => {
        messages.push({
          role: "assistant",
          content: `Buscando por "${query}"...\n\n(Integre com API de busca: Google Custom Search, Bing, etc)\n\nResultados simulados:\n• Resultado 1\n• Resultado 2\n• Resultado 3`,
          timestamp: new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }),
        });

        saveMessages();
        renderMessages();
      }, 500);
    }

    // ═══════════════════════════════════════════════════════════════
    // INICIALIZAÇÃO
    // ═══════════════════════════════════════════════════════════════

    window.addEventListener("DOMContentLoaded", () => {
      loadProject();
      loadMessages();

      // Atualizar contador de caracteres
      document.getElementById("editorTextarea").addEventListener("input", (e) => {
        const count = e.target.value.length;
        document.getElementById("editorFooter").textContent = `${count} caracteres`;
      });

      // Enter para enviar mensagem
      document.getElementById("chatInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendChatMessage();
        }
      });
    });
  </script>
</body>
</html>
