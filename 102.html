<!DOCTYPE html>
<html lang="pt-BR">

  <title>Iara Suite</title>

  <style>

x-shrink:0;transition:width .2s}#ed-sidebar.hidden{width:0!important;min-width:0!important;border:none;overflow:hidden}#ed-sidebar-top{display:flex;align-items:center;gap:2px;padding:5px 6px;border-bottom:1px solid var(--border);flex-shrink:0;min-height:36px}#ed-sidebar-top span{font-size:10px;font-weight:700;color:var(--muted);flex:1;padding-left:2px;white-space:nowrap}.sib{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:3px 5px;border-radius:5px;font-size:13px;transition:.15s;flex-shrink:0;line-height:1}.sib:hover{background:var(--bg3);color:var(--text)}#file-tree{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 0}.tree-folder{user-select:none}.tree-folder-row{display:flex;align-items:center;gap:4px;padding:4px 6px;cursor:pointer;border-radius:5px;margin:1px 4px;transition:.12s;position:relative;min-height:26px}.tree-folder-row:hover{background:var(--bg3)}.tree-folder-row:hover .tree-actions{opacity:1}.tree-folder-icon{font-size:10px;flex-shrink:0;transition:transform .15s;display:inline-block;width:10px;text-align:center}.tree-folder-icon.open{transform:rotate(90deg)}.tree-folder-name{flex:1;font-size:12px;font-weight:600;color:var(--yellow);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree-file-row{display:flex;align-items:center;gap:4px;padding:4px 6px;cursor:pointer;border-radius:5px;margin:1px 4px;transition:.12s;position:relative;min-height:26px}.tree-file-row:hover{background:var(--bg3)}.tree-file-row.active{background:var(--primary2)}.tree-file-row.active .tree-file-name{color:#fff}.tree-file-row:hover .tree-actions,.tree-file-row.active .tree-actions{opacity:1}.tree-file-icon{font-size:12px;flex-shrink:0}.tree-file-name{flex:1;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tree-actions{opacity:0;display:flex;gap:1px;position:absolute;right:4px;background:var(--bg3);border-radius:4px;padding:1px;transition:opacity .12s}.tree-file-row.active .tree-actions{background:var(--primary2)}.ta-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:2px 4px;border-radius:3px;font-size:11px;transition:.1s;line-height:1}.ta-btn:hover{background:rgba(255,255,255,.15);color:var(--text)}.tree-children{padding-left:14px}.tree-children.collapsed{display:none}#ed-main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}#ed-toolbar{display:flex;align-items:center;gap:4px;padding:4px 8px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap;min-height:38px}#ed-fname{background:transparent;border:1px solid transparent;color:var(--text);font-size:12px;font-weight:600;padding:2px 6px;border-radius:5px;font-family:'Courier New',monospace;max-width:160px;min-width:50px;transition:.15s}#ed-fname:hover{border-color:var(--border)}#ed-fname:focus{border-color:var(--primary);background:var(--bg3);outline:none}.lbadge{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;font-family:'Courier New',monospace;white-space:nowrap}.pmb{background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;padding:3px 7px;border-radius:5px;font-size:12px;transition:.15s;white-space:nowrap;line-height:1.4}.pmb:hover{background:var(--bg3);border-color:var(--border)}.pmb.active{background:var(--bg3);border-color:var(--primary);color:var(--primary)}#ed-work{flex:1;display:flex;flex-direction:row;overflow:hidden;position:relative}#code-wrap{flex:1;display:flex;overflow:hidden;background:var(--bg);min-height:0}#line-nums{background:var(--bg2);border-right:1px solid var(--border2);padding:10px 0;min-width:36px;text-align:right;overflow:hidden;flex-shrink:0;user-select:none}.ln{display:block;padding:0 8px;font-size:12px;line-height:1.6;color:var(--muted2);font-family:'Courier New',monospace}#code-ta{flex:1;background:transparent;border:none;color:var(--text);font-family:'Courier New',monospace;font-size:13px;line-height:1.6;padding:10px 12px;resize:none;outline:none;tab-size:2;overflow-y:auto}#preview-wrap{display:none;flex-direction:column;flex:1;overflow:hidden;border-left:2px solid var(--border);background:var(--bg)}#preview-wrap.split{display:flex}#preview-wrap.full{position:absolute;inset:0;z-index:50;border:none}#preview-bar{display:flex;align-items:center;gap:6px;padding:0 8px;height:30px;min-height:30px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;user-select:none}#prev-lbl{font-size:11px;color:var(--muted);flex:1}.prev-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:11px;padding:2px 6px;border-radius:4px;transition:.15s}.prev-btn:hover{background:var(--bg3);color:var(--text)}#preview-frame{flex:1;border:none;background:white}#ed-divider{width:0;cursor:col-resize;flex-shrink:0;background:transparent;transition:width .15s}#ed-divider.show{width:8px;background:var(--border)}#ed-divider.show:hover{background:var(--primary)}#ed-divider.drag{background:var(--primary)}#ai-panel{display:flex;flex-direction:column;width:0;overflow:hidden;background:var(--bg2);border-left:1px solid var(--border);transition:width .2s}#ai-panel.hidden{width:0!important}#ai-head{padding:8px;border-bottom:1px solid var(--border);flex-shrink:0}#ai-head-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#ai-prov{font-size:10px;color:var(--muted)}#ai-msgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}.ai-msg{padding:8px;border-radius:6px;font-size:12px;line-height:1.5}.ai-msg.user{background:var(--primary2);margin-left:20px}.ai-msg.assistant{background:var(--bg3);margin-right:20px}#ai-foot{padding:8px;border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:6px}#ai-ta{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:4px;font-family:monospace;font-size:11px;resize:none}#ai-ta:focus{outline:none;border-color:var(--primary)}#ai-btns{display:flex;gap:4px;flex-wrap:wrap}.btn{border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600;transition:.15s}.btn-primary{background:var(--primary);color:#000}.btn-primary:hover{background:#6bb6ff}.btn-secondary{background:var(--green);color:#000}.btn-secondary:hover{background:#4ac95f}.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}.btn-ghost:hover{background:var(--bg3)}#ai-st{font-size:10px;color:var(--muted);text-align:right}#mapper-panel{flex-direction:column}#mapper-inner{flex:1;overflow-y:auto;padding:20px}.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:20px;margin-bottom:20px}.drop-zone{border:2px dashed var(--border);border-radius:8px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .2s}.drop-zone:hover,.drop-zone.over{border-color:var(--primary);background:rgba(88,166,255,.05)}.flex-between{display:flex;justify-content:space-between;align-items:center}.label{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px}.inp-grp{display:flex;gap:8px}input[type="text"],input[type="password"],textarea{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:4px;font-family:monospace;font-size:12px}input[type="text"]:focus,input[type="password"]:focus,textarea:focus{outline:none;border-color:var(--primary)}.slot-card{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:12px}.slot-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.slot-badge{background:var(--bg);padding:4px 8px;border-radius:4px;font-size:11px;font-weight:600}.slot-badge.on{background:var(--green2);color:var(--green)}.act-btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:11px;cursor:pointer}.act-btn.on{background:var(--green2);border-color:var(--green);color:var(--green)}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}.modal.open{display:flex}.modal-content{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:20px;max-width:500px;max-height:80vh;overflow-y:auto}.modal-title{font-size:16px;font-weight:700;margin-bottom:16px}#slots-wrap{display:flex;flex-direction:column;gap:12px}.hidden{display:none!important}.map-file-list{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:12px;margin-top:12px}.map-file-item{padding:6px 0;font-size:12px;border-bottom:1px solid var(--border2)}.map-file-item:last-child{border-bottom:none}.map-stats{display:flex;gap:12px;margin-top:12px;font-size:11px}.map-stat{background:var(--bg3);padding:8px 12px;border-radius:6px;flex:1;text-align:center}
  </style>
</head>
<body>

<nav id="nav">
  <div class="nav-logo">⚡ <span>Iara</span> Suite</div>
  <div class="nav-sep"></div>
  <button class="tab-btn active" data-tab="editor">💻 Editor</button>
  <button class="tab-btn" data-tab="mapper">🗺️ Mapa</button>
  <div class="nav-sep"></div>
  <button class="btn btn-ghost" style="padding:4px 10px;font-size:11px" onclick="openKeysModal()">🔑 Chaves API</button>
</nav>

<div id="panels">

  <div id="editor-panel" class="panel active">
    <div id="ed-sidebar">
      <div id="ed-sidebar-top">
        <span>ARQUIVOS</span>
        <button class="sib" title="Novo arquivo" onclick="treeNewFile()">📄+</button>
        <button class="sib" title="Nova pasta" onclick="treeNewFolder()">📁+</button>
        <button class="sib" title="Importar ZIP" onclick="qs('#zip-in').click()">📦</button>
        <button class="sib" title="Fechar sidebar" onclick="toggleSidebar()">✕</button>
        <input type="file" id="zip-in" accept=".zip" style="display:none" onchange="handleZipImport(event)">
      </div>
      <div id="file-tree"></div>
    </div>

    <div id="ed-main">
      <div id="ed-toolbar">
        <button class="pmb" id="btn-sidebar" onclick="toggleSidebar()" title="Arquivos">☰</button>
        <input id="ed-fname" type="text" value="sem arquivo" onblur="renameCurrentFile()" onkeydown="if(event.key==='Enter')this.blur()">
        <span class="lbadge" id="lbadge"></span>
        <div style="flex:1;min-width:4px"></div>
        <button class="pmb" id="pm-off" onclick="setPM('off')" title="Fechar preview">📝</button>
        <button class="pmb" id="pm-split" onclick="setPM('split')" title="Preview">⚡</button>
        <button class="pmb" id="pm-full" onclick="setPM('full')" title="Preview grande">🟥</button>
        <button class="pmb" onclick="openPrevTab()" title="Abrir em aba">↗</button>
        <button class="pmb" onclick="saveFile()" title="Salvar Ctrl+S">💾</button>
        <button class="pmb" onclick="exportZip()" title="Exportar ZIP">📤</button>
        <button class="pmb" onclick="toggleAI()" title="IA">🤖 IA</button>
      </div>

      <div id="ed-work">
        <div id="code-wrap">
          <div id="line-nums"></div>
          <textarea id="code-ta" placeholder="Selecione ou crie um arquivo…" oninput="onCodeInput()" onscroll="syncScroll()" onkeydown="codeKD(event)" spellcheck="false"></textarea>
        </div>

        <div id="ed-divider" onmousedown="startDrag(event)"></div>

        <div id="preview-wrap">
          <div id="preview-bar">
            <span id="prev-lbl"></span>
            <button class="prev-btn" onclick="setPM('off')">✕</button>
          </div>
          <iframe id="preview-frame"></iframe>
        </div>

        <div id="ai-panel" class="hidden">
          <div id="ai-head">
            <div id="ai-head-top">
              <span style="font-size:12px;font-weight:700">🤖 Jasmim</span>
              <button class="sib" onclick="toggleAI()">✕</button>
            </div>
            <div id="ai-prov">Nenhuma chave ativa</div>
          </div>
          <div id="ai-msgs"></div>
          <div id="ai-foot">
            <textarea id="ai-ta" placeholder="Pergunte algo… (Ctrl+Enter envia)" onkeydown="aiKD(event)" rows="3"></textarea>
            <div id="ai-btns">
              <button class="btn btn-primary" style="font-size:11px;padding:4px 10px" onclick="sendAI()">Enviar</button>
              <button class="btn btn-secondary" style="font-size:11px;padding:4px 10px" onclick="sendWithCode()">+ Código</button>
              <button class="btn btn-ghost" style="font-size:11px;padding:4px 10px" onclick="insertCode()">⬇ Inserir</button>
              <button class="btn btn-ghost" style="font-size:11px;padding:4px 8px" onclick="clearAI()">🗑️</button>
            </div>
            <div id="ai-st">pronto</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="mapper-panel" class="panel">
    <div id="mapper-inner">
      <div class="card">
        <div class="flex-between" style="margin-bottom:10px">
          <div>
            <div style="font-size:15px;font-weight:700">🗺️ Project Mapper</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">Dr. Maikon Caldeira — OAB/MG 183712</div>
          </div>
        </div>
        <div class="drop-zone" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="mapDrop(event)" onclick="qs('#map-file-in').click()">
          <div style="font-size:28px;margin-bottom:6px">📦</div>
          <div style="font-weight:600">Arraste um ZIP aqui</div>
          <div style="font-size:11px;margin-top:4px;color:var(--muted)">ou clique para selecionar</div>
          <input type="file" accept=".zip" style="display:none" id="map-file-in" onchange="mapLoaded(event)">
        </div>
        <div id="map-content"></div>
      </div>
    </div>
  </div>

</div>

<div id="keys-modal" class="modal">
  <div class="modal-content">
    <div class="modal-title">🔑 Gerenciar Chaves API</div>
    <div id="slots-wrap"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn btn-primary" onclick="saveKeys()">Salvar</button>
      <button class="btn btn-ghost" onclick="closeKeysModal()">Cancelar</button>
    </div>
  </div>
</div>

<div id="rename-modal" class="modal">
  <div class="modal-content">
    <div class="modal-title" id="rename-title">✏️ Renomear</div>
    <input type="text" id="rename-input" placeholder="Novo nome" style="width:100%;margin-bottom:16px">
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" onclick="confirmRename()">Renomear</button>
      <button class="btn btn-ghost" onclick="closeRenameModal()">Cancelar</button>
    </div>
  </div>
</div>

<script>

'hidden');if(!ap?.classList.contains('hidden')){qs('#ai-ta')?.focus();if(!slots.length){slots=[{key:'',model:'',baseUrl:'',active:false}];lsSet('iara-slots',JSON.stringify(slots))}updateProvInfo()}}function addMsg(role,content){aiMsgs.push({role,content});renderAiMsgs()}function renderAiMsgs(){const el=qs('#ai-msgs');if(!el)return;el.innerHTML=aiMsgs.map(m=>`<div class="ai-msg ${m.role}">${esc(m.content)}</div>`).join('');el.scrollTop=el.scrollHeight}function aiKD(e){if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();sendAI()}}async function sendAI(){const ta=qs('#ai-ta');if(!ta||!ta.value.trim())return;const msg=ta.value.trim();ta.value='';addMsg('user',msg);aiLoading=true;qs('#ai-st').textContent='enviando...';try{const messages=[{role:'system',content:'Você é um assistente de programação útil. Responda em português.'},{role:'user',content:msg},...aiMsgs.filter(m=>m.role!=='user').slice(-4).map(m=>({role:m.role,content:m.content}))];const resp=await callAI(messages);addMsg('assistant',resp);qs('#ai-st').textContent='pronto'}catch(e){addMsg('assistant','❌ Erro: '+e.message);qs('#ai-st').textContent='erro'}finally{aiLoading=false}}function sendWithCode(){const ta=qs('#ai-ta');if(!ta||!ta.value.trim())return;const code=files[curFile]||'';ta.value=ta.value+'\n\n```\n'+code+'\n```';sendAI()}function insertCode(){const msg=aiMsgs[aiMsgs.length-1];if(!msg||msg.role!=='assistant')return;const code=msg.content.match(/```[\w]*\n([\s\S]*?)\n```/)?.[1]||msg.content;if(!curFile)return;files[curFile]=code;const ta=qs('#code-ta');if(ta)ta.value=code;onCodeInput();updateLineNums();toast('✅ Código inserido!')}function clearAI(){aiMsgs=[];renderAiMsgs()}function handleZipImport(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=async ev=>{try{const zip=new JSZip();const loaded=await zip.loadAsync(ev.target.result);for(const[path,obj]of Object.entries(loaded.files)){if(!obj.dir){const content=await obj.async('string');files[path.replace(/^\//,'')]=content}}saveAll();renderTree();toast('✅ ZIP importado!');e.target.value=''}catch(err){toast('❌ Erro ao importar ZIP','err')}};reader.readAsArrayBuffer(file)}function exportZip(){const zip=new JSZip();for(const[path,content]of Object.entries(files)){zip.file(path,content)}zip.generateAsync({type:'blob'}).then(blob=>{dlBlob(blob,'projeto.zip');toast('📤 ZIP exportado!')})}function mapDrop(e){e.preventDefault();e.stopPropagation();const files=e.dataTransfer.files;if(files.length)mapLoaded({target:{files}})}function mapLoaded(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=async ev=>{try{const zip=new JSZip();const loaded=await zip.loadAsync(ev.target.result);const fileList=Object.keys(loaded.files).filter(p=>!loaded.files[p].dir);let html=`<div class="map-file-list"><strong>📦 ${fileList.length} arquivo(s)</strong>`;fileList.forEach(f=>{html+=`<div class="map-file-item">${esc(f)}</div>`});html+='</div>';const totalSize=fileList.reduce((sum,f)=>sum+(loaded.files[f]._data?.uncompressedSize||0),0);html+=`<div class="map-stats"><div class="map-stat">📊 ${fileList.length}<br>Arquivos</div><div class="map-stat">💾 ${(totalSize/1024).toFixed(1)}KB<br>Total</div></div>`;qs('#map-content').innerHTML=html;toast('✅ Mapa carregado!')}catch(err){toast('❌ Erro ao carregar mapa','err')}};reader.readAsArrayBuffer(file)}window.addEventListener('DOMContentLoaded',()=>{initTabs();initEditor();const saved=ls('iara-slots');if(saved)try{slots=JSON.parse(saved)}catch{}updateProvInfo()});
