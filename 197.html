<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Code Debugger — Dr. Maikon Caldeira</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    .container { display: flex; flex-direction: column; height: 100vh; }
    .header { background: #1e293b; border-bottom: 1px solid #334155; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .header-title { font-size: 14px; font-weight: 600; color: #58a6ff; }
    .header-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 8px 14px; background: #6366f1; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: 600; transition: all 0.2s; }
    .btn:hover:not(:disabled) { background: #4f46e5; }
    .btn:disabled { background: #475569; cursor: not-allowed; opacity: 0.5; }
    .btn.secondary { background: #475569; }
    .btn.danger { background: #ff6b6b; }
    .btn.success { background: #3fb950; }
    .header-status { margin-left: auto; font-size: 11px; color: #94a3b8; }
    .file-input-wrapper { position: relative; overflow: hidden; }
    .file-input-wrapper input[type="file"] { position: absolute; left: -9999px; }
    .content { flex: 1; display: flex; gap: 0; overflow: hidden; }
    .search-panel { width: 280px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
    .search-header { padding: 12px; background: #0f172a; border-bottom: 1px solid #334155; }
    .search-header h3 { font-size: 12px; color: #58a6ff; margin-bottom: 8px; }
    .search-input { width: 100%; padding: 8px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; font-size: 11px; }
    .search-input:focus { outline: none; border-color: #58a6ff; }
    .search-filters { padding: 8px; border-bottom: 1px solid #334155; display: flex; gap: 4px; flex-wrap: wrap; }
    .filter-btn { padding: 4px 8px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #94a3b8; cursor: pointer; font-size: 10px; transition: all 0.2s; }
    .filter-btn:hover { border-color: #58a6ff; color: #58a6ff; }
    .filter-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; }
    .results-list { flex: 1; overflow-y: auto; padding: 8px; }
    .result-item { padding: 8px; margin-bottom: 6px; background: #0f172a; border: 1px solid #334155; border-radius: 4px; cursor: pointer; transition: all 0.2s; font-size: 11px; }
    .result-item:hover { background: #1e293b; border-color: #58a6ff; }
    .result-item.active { background: #1e293b; border-color: #3fb950; box-shadow: 0 0 8px rgba(63, 185, 80, 0.3); }
    .result-line { color: #58a6ff; font-weight: 600; margin-bottom: 4px; }
    .result-text { color: #94a3b8; font-size: 10px; font-family: monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .editor-wrapper { flex: 1; display: flex; overflow: hidden; }
    .line-numbers { background: #0f172a; color: #475569; padding: 8px 12px; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.5; border-right: 1px solid #334155; overflow: hidden; user-select: none; text-align: right; }
    .code-editor { flex: 1; padding: 8px 12px; background: #0f172a; color: #e2e8f0; border: none; font-family: 'Courier New', monospace; font-size: 11px; line-height: 1.5; resize: none; outline: none; overflow: auto; white-space: pre; }
    .highlight-line { background: rgba(255, 193, 7, 0.2); }
    .highlight-match { background: rgba(63, 185, 80, 0.3); color: #3fb950; font-weight: 600; }
    .bottom-info { height: 150px; background: #1e293b; border-top: 1px solid #334155; display: flex; flex-direction: column; overflow: hidden; }
    .bottom-header { padding: 8px 12px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 11px; color: #58a6ff; font-weight: 600; }
    .bottom-content { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 11px; font-family: monospace; line-height: 1.6; }
    .info-item { margin-bottom: 6px; padding: 6px; background: #0f172a; border-left: 3px solid #58a6ff; border-radius: 2px; }
    .info-label { color: #94a3b8; font-size: 10px; }
    .info-value { color: #3fb950; font-weight: 600; }
    .copy-btn { padding: 4px 8px; background: #6366f1; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 10px; margin-top: 4px; }
    .copy-btn:hover { background: #4f46e5; }
    .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 16px; background: #3fb950; color: #fff; border-radius: 8px; font-size: 11px; font-weight: 600; z-index: 9999; animation: slideIn 0.3s ease-out; }
    .toast.err { background: #ff6b6b; }
    .toast.warn { background: #ffc107; color: #000; }
    @keyframes slideIn { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @media (max-width: 768px) { .search-panel { width: 100%; height: 150px; border-right: none; border-bottom: 1px solid #334155; } .content { flex-direction: column; } .editor-wrapper { flex-direction: column; } .bottom-info { height: 120px; } }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-title">🔍 Code Debugger</div>
    <div class="header-buttons">
      <div class="file-input-wrapper">
        <button class="btn">📁 Abrir Arquivo</button>
        <input type="file" id="file-input" accept="*">
      </div>
      <button class="btn secondary" id="btn-case">Aa Case</button>
      <button class="btn secondary" id="btn-word">Palavra</button>
      <button class="btn secondary" id="btn-regex">.*Regex</button>
      <button class="btn danger" id="btn-clear">🗑️ Limpar</button>
    </div>
    <div class="header-status">
      <span id="status-text">Pronto</span>
    </div>
  </div>
  
  <div class="content">
    <!-- SEARCH PANEL -->
    <div class="search-panel">
      <div class="search-header">
        <h3>🔍 Buscar</h3>
        <input type="text" id="search-input" class="search-input" placeholder="Digite aqui...">
      </div>
      
      <div class="search-filters">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="error">❌ Erro</button>
        <button class="filter-btn" data-filter="warn">⚠️ Aviso</button>
        <button class="filter-btn" data-filter="todo">📝 TODO</button>
      </div>
      
      <div class="results-list" id="results-list">
        <div style="color: #94a3b8; font-size: 11px; text-align: center; padding: 20px;">
          📁 Importe um arquivo
        </div>
      </div>
    </div>
    
    <!-- MAIN AREA -->
    <div class="main-area">
      <div class="editor-wrapper">
        <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">
          <div style="padding: 8px 12px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 11px; color: #94a3b8;">
            <span id="file-name">Nenhum arquivo</span>
          </div>
          <div style="flex: 1; display: flex; overflow: hidden;">
            <div class="line-numbers" id="line-numbers"></div>
            <textarea class="code-editor" id="code-editor" placeholder="Importe um arquivo..." readonly></textarea>
          </div>
        </div>
      </div>
      
      <div class="bottom-info">
        <div class="bottom-header">ℹ️ Informações da Linha</div>
        <div class="bottom-content" id="bottom-content">
          <div class="info-item">
            <div class="info-label">Selecione um resultado para ver detalhes</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const qs = s => document.querySelector(s);
  const qsa = s => [...document.querySelectorAll(s)];
  
  let fileContent = '';
  let fileName = '';
  let searchResults = [];
  let currentFilter = 'all';
  let caseSensitive = false;
  let wholeWord = false;
  let useRegex = false;
  
  function toast(msg, type = 'ok') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
  
  async function handleFileUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    
    try {
      fileContent = await file.text();
      fileName = file.name;
      qs('#file-name').textContent = fileName;
      qs('#code-editor').value = fileContent;
      updateLineNumbers();
      toast('✅ Arquivo carregado!');
    } catch (err) {
      toast('❌ Erro: ' + err.message, 'err');
    }
    
    qs('#file-input').value = '';
  }
  
  function updateLineNumbers() {
    const lines = fileContent.split('\n').length;
    qs('#line-numbers').innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('\n');
  }
  
  function performSearch() {
    if (!fileContent) {
      toast('❌ Importe um arquivo primeiro', 'err');
      return;
    }
    
    const searchTerm = qs('#search-input').value;
    if (!searchTerm) {
      searchResults = [];
      renderResults();
      return;
    }
    
    searchResults = [];
    const lines = fileContent.split('\n');
    
    lines.forEach((line, lineNum) => {
      let matches = [];
      
      try {
        let regex;
        if (useRegex) {
          const flags = caseSensitive ? 'g' : 'gi';
          regex = new RegExp(searchTerm, flags);
        } else {
          const escapedTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const pattern = wholeWord ? `\\b${escapedTerm}\\b` : escapedTerm;
          const flags = caseSensitive ? 'g' : 'gi';
          regex = new RegExp(pattern, flags);
        }
        
        let match;
        while ((match = regex.exec(line)) !== null) {
          matches.push({
            start: match.index,
            end: match.index + match[0].length,
            text: match[0]
          });
        }
      } catch (err) {
        console.error('Erro regex:', err);
      }
      
      if (matches.length > 0) {
        // Detectar tipo
        let type = 'match';
        if (line.includes('error') || line.includes('Error') || line.includes('ERROR')) type = 'error';
        else if (line.includes('warn') || line.includes('Warning') || line.includes('WARN')) type = 'warn';
        else if (line.includes('TODO') || line.includes('FIXME')) type = 'todo';
        
        searchResults.push({
          lineNum: lineNum + 1,
          line: line,
          matches: matches,
          type: type
        });
      }
    });
    
    renderResults();
    toast(`✅ ${searchResults.length} resultado(s) encontrado(s)`);
  }
  
  function renderResults() {
    const filtered = searchResults.filter(r => {
      if (currentFilter === 'all') return true;
      return r.type === currentFilter;
    });
    
    const html = filtered.map((r, i) => `
      <div class="result-item" onclick="selectResult(${searchResults.indexOf(r)})">
        <div class="result-line">Linha ${r.lineNum}</div>
        <div class="result-text">${escapeHtml(r.line.slice(0, 50))}</div>
      </div>
    `).join('');
    
    qs('#results-list').innerHTML = html || '<div style="color: #94a3b8; font-size: 11px; padding: 20px;">Nenhum resultado</div>';
  }
  
  function selectResult(i) {
    const result = searchResults[i];
    const ta = qs('#code-editor');
    const lines = fileContent.split('\n');
    
    // Scroll para linha
    const lineHeight = 19.2;
    ta.scrollTop = (result.lineNum - 1) * lineHeight - 100;
    
    // Highlight linha
    const beforeLines = lines.slice(0, result.lineNum - 1).join('\n');
    const startPos = beforeLines.length + (result.lineNum > 1 ? 1 : 0);
    const endPos = startPos + lines[result.lineNum - 1].length;
    ta.setSelectionRange(startPos, endPos);
    
    // Mostrar info
    const lineContent = lines[result.lineNum - 1];
    qs('#bottom-content').innerHTML = `
      <div class="info-item">
        <div class="info-label">Linha:</div>
        <div class="info-value">${result.lineNum}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Tipo:</div>
        <div class="info-value">${result.type === 'error' ? '❌ Erro' : result.type === 'warn' ? '⚠️ Aviso' : result.type === 'todo' ? '📝 TODO' : '🔍 Match'}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Conteúdo:</div>
        <div class="info-value" style="word-break: break-all; font-size: 10px;">${escapeHtml(lineContent)}</div>
        <button class="copy-btn" onclick="copyToClipboard('${escapeHtml(lineContent).replace(/'/g, "\\'")}')">📋 Copiar Linha</button>
      </div>
    `;
  }
  
  function copyToClipboard(text) {
    navigator.clipboard.writeText(text);
    toast('📋 Copiado!');
  }
  
  function escapeHtml(text) {
    const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
    return text.replace(/[&<>"']/g, m => map[m]);
  }
  
  function toggleFilter(filter) {
    currentFilter = filter;
    qsa('.filter-btn').forEach(b => b.classList.remove('active'));
    qs(`[data-filter="${filter}"]`).classList.add('active');
    renderResults();
  }
  
  function clearSearch() {
    qs('#search-input').value = '';
    searchResults = [];
    renderResults();
  }
  
  // Events
  qs('#file-input').addEventListener('change', handleFileUpload);
  qs('#search-input').addEventListener('input', performSearch);
  qs('#btn-case').addEventListener('click', () => {
    caseSensitive = !caseSensitive;
    qs('#btn-case').classList.toggle('active');
    performSearch();
  });
  qs('#btn-word').addEventListener('click', () => {
    wholeWord = !wholeWord;
    qs('#btn-word').classList.toggle('active');
    performSearch();
  });
  qs('#btn-regex').addEventListener('click', () => {
    useRegex = !useRegex;
    qs('#btn-regex').classList.toggle('active');
    performSearch();
  });
  qs('#btn-clear').addEventListener('click', clearSearch);
  
  qsa('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => toggleFilter(btn.dataset.filter));
  });
</script>

</body>
</html>
