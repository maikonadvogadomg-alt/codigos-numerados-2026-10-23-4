<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Editor Visual</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Arial, sans-serif;
  background: #0d1117;
  color: #ccc;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ====== TOPBAR ====== */
.topbar {
  background: #161b22;
  border-bottom: 2px solid #1f6feb;
  padding: 6px 8px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
  z-index: 200;
}

.topbar-title {
  font-size: 14px;
  font-weight: bold;
  color: #1f6feb;
  margin-right: 6px;
  white-space: nowrap;
}

.btn {
  border: none;
  border-radius: 5px;
  padding: 7px 10px;
  cursor: pointer;
  font-weight: bold;
  font-size: 12px;
  color: white;
  background: #1f6feb;
  white-space: nowrap;
  flex-shrink: 0;
}
.btn:hover { background: #388bfd; }
.btn.green { background: #238636; }
.btn.green:hover { background: #2ea043; }
.btn.red { background: #b91c1c; }
.btn.red:hover { background: #dc2626; }
.btn.gray { background: #374151; }
.btn.gray:hover { background: #4b5563; }
.btn.orange { background: #b45309; }
.btn.orange:hover { background: #d97706; }

/* ====== ÁREA PRINCIPAL ====== */
.workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}

/* ====== PAINÉIS LATERAIS ====== */
.painel {
  display: flex;
  flex-direction: column;
  background: #0d1117;
  border-right: 1px solid #30363d;
  transition: width 0.25s ease;
  overflow: hidden;
  flex-shrink: 0;
}

.painel.fechado {
  width: 0 !important;
  border: none;
}

.painel-header {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 8px 10px;
  font-size: 12px;
  font-weight: bold;
  color: #8b949e;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  white-space: nowrap;
}

.painel-body {
  flex: 1;
  overflow: auto;
  min-height: 0;
}

#painelCodigo {
  width: 340px;
}

#painelProps {
  width: 280px;
  border-right: none;
  border-left: 1px solid #30363d;
}

/* ====== TEXTAREA CÓDIGO ====== */
#codeInput {
  width: 100%;
  height: 100%;
  background: #0d1117;
  color: #c9d1d9;
  border: none;
  outline: none;
  padding: 12px;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  line-height: 1.5;
  resize: none;
}

/* ====== PREVIEW ====== */
.preview-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: #fff;
}

.preview-header {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 8px 10px;
  font-size: 12px;
  font-weight: bold;
  color: #8b949e;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.preview-header span {
  flex: 1;
}

#previewFrame {
  flex: 1;
  border: none;
  width: 100%;
  background: white;
}

/* ====== PROPRIEDADES ====== */
.props-body {
  padding: 10px;
}

.props-empty {
  color: #6b7280;
  font-size: 12px;
  line-height: 1.6;
  padding: 12px;
}

.grupo {
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid #21262d;
}
.grupo:last-child { border-bottom: none; }

.grupo-titulo {
  font-size: 11px;
  font-weight: bold;
  color: #1f6feb;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.campo-label {
  font-size: 11px;
  color: #8b949e;
  margin: 6px 0 3px;
  display: block;
}

.campo-input {
  width: 100%;
  padding: 6px 8px;
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 5px;
  color: #c9d1d9;
  font-size: 12px;
  outline: none;
  font-family: 'Courier New', monospace;
}
.campo-input:focus { border-color: #1f6feb; }

.campo-input.cor {
  height: 36px;
  padding: 2px 4px;
  cursor: pointer;
}

textarea.campo-input {
  resize: vertical;
  min-height: 60px;
  font-family: Arial, sans-serif;
}

.row2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.info-selecionado {
  background: #161b22;
  border-left: 3px solid #1f6feb;
  border-radius: 5px;
  padding: 8px 10px;
  font-size: 11px;
  margin-bottom: 10px;
  word-break: break-all;
  line-height: 1.5;
}

.acoes-btn {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.acoes-btn .btn {
  flex: 1;
  text-align: center;
  padding: 8px 6px;
  font-size: 11px;
}

/* ====== ABAS MOBILE ====== */
.abas-mobile {
  display: none;
  background: #161b22;
  border-bottom: 1px solid #30363d;
  flex-shrink: 0;
}

.abas-mobile button {
  flex: 1;
  border: none;
  background: transparent;
  color: #8b949e;
  padding: 10px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}

.abas-mobile button.ativa {
  color: #1f6feb;
  border-bottom-color: #1f6feb;
}

/* ====== STATUS ====== */
#statusBar {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(22, 27, 34, 0.97);
  border: 1px solid #30363d;
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 12px;
  color: #c9d1d9;
  z-index: 999;
  pointer-events: none;
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ====== SCROLLBAR ====== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: #0d1117; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }

/* ====== RESPONSIVO TABLET ====== */
@media (max-width: 1100px) {
  #painelCodigo { width: 280px; }
  #painelProps { width: 240px; }
}

@media (max-width: 850px) {
  #painelCodigo { width: 260px; }
  #painelProps { width: 220px; }
}

/* ====== RESPONSIVO MOBILE ====== */
@media (max-width: 640px) {
  .topbar-title { display: none; }

  .btn {
    padding: 7px 8px;
    font-size: 11px;
  }

  .workspace {
    flex-direction: column;
  }

  .abas-mobile {
    display: flex;
  }

  #painelCodigo {
    width: 100% !important;
    height: 100%;
    border-right: none;
    border-bottom: 1px solid #30363d;
    display: none;
  }

  #painelCodigo.aba-ativa {
    display: flex;
  }

  #painelProps {
    width: 100% !important;
    height: 100%;
    border-left: none;
    border-top: 1px solid #30363d;
    display: none;
  }

  #painelProps.aba-ativa {
    display: flex;
  }

  .preview-area {
    display: none;
  }

  .preview-area.aba-ativa {
    display: flex;
  }

  .painel.fechado {
    display: none !important;
  }
}

/* ====== INPUT FILE ESCONDIDO ====== */
#fileInput { display: none; }
</style>
</head>
<body>

<!-- ====== TOPBAR ====== -->
<div class="topbar">
  <span class="topbar-title">🐝 Editor Visual</span>

  <button class="btn" onclick="togglePainel('painelCodigo')" title="Abrir/fechar código">📝 Código</button>
  <button class="btn orange" onclick="colarCodigo()" title="Colar da área de transferência">📋 Colar</button>
  <button class="btn green" onclick="renderizar()" title="Visualizar código">▶ Ver</button>
  <button class="btn" onclick="importarArquivo()" title="Importar arquivo HTML">📂 Importar</button>
  <button class="btn" onclick="copiarCodigo()" title="Copiar código">📄 Copiar</button>
  <button class="btn" onclick="baixarHTML()" title="Baixar arquivo HTML">💾 Baixar</button>
  <button class="btn gray" onclick="desfazer()" title="Desfazer">↶ Desfazer</button>
  <button class="btn red" onclick="limparTudo()" title="Limpar tudo">🗑 Limpar</button>
  <button class="btn" onclick="togglePainel('painelProps')" title="Abrir/fechar propriedades">⚙️ Props</button>

  <input type="file" id="fileInput" accept=".html,.htm,.txt" onchange="lerArquivo(event)">
</div>

<!-- ====== ABAS MOBILE ====== -->
<div class="abas-mobile">
  <button id="aba-codigo" onclick="trocarAba('codigo')">📝 Código</button>
  <button id="aba-preview" class="ativa" onclick="trocarAba('preview')">👁️ Preview</button>
  <button id="aba-props" onclick="trocarAba('props')">⚙️ Props</button>
</div>

<!-- ====== WORKSPACE ====== -->
<div class="workspace">

  <!-- PAINEL CÓDIGO -->
  <div class="painel" id="painelCodigo">
    <div class="painel-header">
      <span>📝 Código HTML</span>
      <button class="btn gray" style="padding:3px 8px;font-size:11px;" onclick="togglePainel('painelCodigo')">✕</button>
    </div>
    <div class="painel-body">
      <textarea id="codeInput" spellcheck="false" placeholder="Cole ou importe seu HTML aqui..."></textarea>
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview-area aba-ativa" id="areaPreview">
    <div class="preview-header">
      <span>👁️ Preview — clique em um elemento para editar</span>
    </div>
    <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  </div>

  <!-- PAINEL PROPRIEDADES -->
  <div class="painel" id="painelProps">
    <div class="painel-header">
      <span>⚙️ Propriedades</span>
      <button class="btn gray" style="padding:3px 8px;font-size:11px;" onclick="togglePainel('painelProps')">✕</button>
    </div>
    <div class="painel-body" id="propsBody">
      <div class="props-empty">
        Cole um HTML, clique em <b>Ver</b> e depois clique em qualquer elemento no preview.
      </div>
    </div>
  </div>

</div>

<!-- STATUS -->
<div id="statusBar">Pronto.</div>

<script>
// ============================================================
//  VARIÁVEIS GLOBAIS
// ============================================================
const codeInput   = document.getElementById('codeInput');
const frame       = document.getElementById('previewFrame');
const propsBody   = document.getElementById('propsBody');
const statusBar   = document.getElementById('statusBar');

let elementoSelecionado = null;
let historico = [];
let timerStatus = null;

// ============================================================
//  CÓDIGO EXEMPLO INICIAL
// ============================================================
codeInput.value = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3a5f, #0d1117);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 { color: #1e3a5f; margin-bottom: 16px; font-size: 28px; }
    p  { color: #555; margin-bottom: 28px; line-height: 1.6; }
    .btn-demo {
      background: #1f6feb;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-demo:hover { background: #388bfd; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bem-vindo!</h1>
    <p>Clique em qualquer elemento aqui para editar cores, tamanhos e textos.</p>
    <button class="btn-demo">Clique aqui</button>
  </div>
</body>
</html>`;

// ============================================================
//  STATUS
// ============================================================
function status(msg) {
  statusBar.textContent = msg;
  clearTimeout(timerStatus);
  timerStatus = setTimeout(() => { statusBar.textContent = 'Pronto.'; }, 3000);
}

// ============================================================
//  TOGGLE PAINÉIS (abre/fecha)
// ============================================================
function togglePainel(id) {
  const p = document.getElementById(id);
  p.classList.toggle('fechado');
}

// ============================================================
//  ABAS MOBILE
// ============================================================
function trocarAba(qual) {
  // remove ativa de tudo
  document.getElementById('painelCodigo').classList.remove('aba-ativa');
  document.getElementById('areaPreview').classList.remove('aba-ativa');
  document.getElementById('painelProps').classList.remove('aba-ativa');
  document.getElementById('aba-codigo').classList.remove('ativa');
  document.getElementById('aba-preview').classList.remove('ativa');
  document.getElementById('aba-props').classList.remove('ativa');

  if (qual === 'codigo') {
    document.getElementById('painelCodigo').classList.add('aba-ativa');
    document.getElementById('aba-codigo').classList.add('ativa');
  } else if (qual === 'preview') {
    document.getElementById('areaPreview').classList.add('aba-ativa');
    document.getElementById('aba-preview').classList.add('ativa');
  } else {
    document.getElementById('painelProps').classList.add('aba-ativa');
    document.getElementById('aba-props').classList.add('ativa');
  }
}

// ============================================================
//  COLAR DA ÁREA DE TRANSFERÊNCIA
// ============================================================
async function colarCodigo() {
  try {
    const texto = await navigator.clipboard.readText();
    if (!texto || !texto.trim()) {
      alert('A área de transferência está vazia.\nCopie um código HTML primeiro.');
      return;
    }
    salvarHistorico();
    codeInput.value = texto;
    renderizar();
    status('Código colado com sucesso.');
  } catch (e) {
    // fallback: foca no textarea para o usuário colar manualmente
    codeInput.focus();
    codeInput.select();
    alert('Permissão negada pelo navegador.\nClique na caixa de código e use Ctrl+V (ou longo toque > Colar).');
    status('Use Ctrl+V na caixa de código.');
  }
}

// ============================================================
//  IMPORTAR ARQUIVO (botão real, abre seletor de arquivo)
// ============================================================
function importarArquivo() {
  const fi = document.getElementById('fileInput');
  fi.value = '';
  fi.click();
}

function lerArquivo(e) {
  const arquivo = e.target.files[0];
  if (!arquivo) return;
  const leitor = new FileReader();
  leitor.onload = function(ev) {
    salvarHistorico();
    codeInput.value = ev.target.result;
    renderizar();
    status('Importado: ' + arquivo.name);
  };
  leitor.onerror = function() {
    alert('Erro ao ler o arquivo.');
  };
  leitor.readAsText(arquivo, 'UTF-8');
}

// ============================================================
//  RENDERIZAR (mostrar no preview)
// ============================================================
function renderizar() {
  salvarHistorico();
  elementoSelecionado = null;
  propsBody.innerHTML = '<div class="props-empty">Clique em um elemento no preview.</div>';

  const doc = frame.contentDocument || frame.contentWindow.document;
  doc.open();
  doc.write(codeInput.value);
  doc.close();

  setTimeout(ativarCliques, 300);
  status('Preview atualizado.');
}

// ============================================================
//  ATIVAR CLIQUES NO IFRAME
// ============================================================
function ativarCliques() {
  const doc = frame.contentDocument || frame.contentWindow.document;
  if (!doc || !doc.body) return;

  // injeta estilo de hover/seleção
  let estiloExistente = doc.getElementById('__editor_estilo__');
  if (estiloExistente) estiloExistente.remove();

  const s = doc.createElement('style');
  s.id = '__editor_estilo__';
  s.textContent = `
    .__hover__ {
      outline: 2px dashed #f59e0b !important;
      outline-offset: 2px !important;
      cursor: crosshair !important;
    }
    .__selecionado__ {
      outline: 3px solid #1f6feb !important;
      outline-offset: 3px !important;
    }
  `;
  doc.head.appendChild(s);

  // remove listeners antigos clonando body
  const novoBody = doc.body.cloneNode(true);
  doc.body.parentNode.replaceChild(novoBody, doc.body);

  doc.body.addEventListener('mouseover', function(e) {
    const el = e.target;
    if (!podeSelecionar(el)) return;
    if (el !== elementoSelecionado) el.classList.add('__hover__');
  }, true);

  doc.body.addEventListener('mouseout', function(e) {
    const el = e.target;
    if (!podeSelecionar(el)) return;
    el.classList.remove('__hover__');
  }, true);

  doc.body.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    const el = e.target;
    if (!podeSelecionar(el)) return;
    selecionarElemento(el);
  }, true);

  // suporte toque (mobile)
  doc.body.addEventListener('touchend', function(e) {
    e.preventDefault();
    const toque = e.changedTouches[0];
    const el = doc.elementFromPoint(toque.clientX, toque.clientY);
    if (!el || !podeSelecionar(el)) return;
    selecionarElemento(el);
  }, true);
}

function podeSelecionar(el) {
  if (!el || !el.tagName) return false;
  const tag = el.tagName.toLowerCase();
  if (['html','head','body','style','script','meta','link','title'].includes(tag)) return false;
  if (el.id === '__editor_estilo__') return false;
  return true;
}

// ============================================================
//  SELECIONAR ELEMENTO
// ============================================================
function selecionarElemento(el) {
  const doc = frame.contentDocument || frame.contentWindow.document;

  // remove seleção anterior
  doc.querySelectorAll('.__selecionado__').forEach(x => x.classList.remove('__selecionado__'));
  doc.querySelectorAll('.__hover__').forEach(x => x.classList.remove('__hover__'));

  elementoSelecionado = el;
  el.classList.add('__selecionado__');

  montarPainelProps(el);
  status('Selecionado: <' + el.tagName.toLowerCase() + '>');

  // no mobile, vai para aba de props automaticamente
  if (window.innerWidth <= 640) {
    trocarAba('props');
  }
}

// ============================================================
//  MONTAR PAINEL DE PROPRIEDADES
// ============================================================
function montarPainelProps(el) {
  const cs = frame.contentWindow.getComputedStyle(el);

  propsBody.innerHTML = `
    <div class="props-body">

      <div class="info-selecionado">
        <b>&lt;${el.tagName.toLowerCase()}&gt;</b><br>
        ID: ${e(el.id) || '(nenhum)'}<br>
        Classe: ${e(el.className) || '(nenhuma)'}
      </div>

      <div class="grupo">
        <div class="grupo-titulo">Texto / Conteúdo</div>
        <label class="campo-label">Texto visível</label>
        <textarea class="campo-input" rows="3" oninput="editarTexto(this.value)">${e(el.innerText || '')}</textarea>
      </div>

      <div class="grupo">
        <div class="grupo-titulo">Identificação</div>
        <label class="campo-label">ID</label>
        <input class="campo-input" value="${e(el.id || '')}" oninput="editarAttr('id', this.value)">
        <label class="campo-label">Classe CSS</label>
        <input class="campo-input" value="${e(el.className || '')}" oninput="editarClasse(this.value)">
      </div>

      <div class="grupo">
        <div class="grupo-titulo">Cores</div>
        <label class="campo-label">Cor do texto</label>
        <input type="color" class="campo-input cor" value="${rgb2hex(cs.color)}" oninput="editarEstilo('color', this.value)">
        <label class="campo-label">Cor de fundo</label>
        <input type="color" class="campo-input cor" value="${rgb2hex(cs.backgroundColor)}" oninput="editarEstilo('backgroundColor', this.value)">
        <label class="campo-label">Cor da borda</label>
        <input type="color" class="campo-input cor" value="${rgb2hex(cs.borderColor)}" oninput="editarEstilo('borderColor', this.value)">
      </div>

      <div class="grupo">
        <div class="grupo-titulo">Tamanho</div>
        <div class="row2">
          <div>
            <label class="campo-label">Largura</label>
            <input class="campo-input" value="${cs.width}" oninput="editarEstilo('width', this.value)">
          </div>
          <div>
            <label class="campo-label">Altura</label>
            <input class="campo-input" value="${cs.height}" oninput="editarEstilo('height', this.value)">
          </div>
        </div>
        <label class="campo-label">Tamanho da fonte</label>
        <input class="campo-input" value="${cs.fontSize}" oninput="editarEstilo('fontSize', this.value)">
        <label class="campo-label">Peso da fonte</label>
        <select class="campo-input" onchange="editarEstilo('fontWeight', this.value)">
          <option value="">— manter —</option>
          <option value="normal">normal</option>
          <option value="bold">bold</option>
          <option value="100">100</option>
          <option value="300">300</option>
          <option value="400">400</option>
          <option value="600">600</option>
          <option value="700">700</option>
          <option value="900">900</option>
        </select>
      </div>

      <div class="grupo">
        <div class="grupo-titulo">Espaçamento</div>
        <label class="campo-label">Margem (margin)</label>
        <input class="campo-input" value="${cs.margin}" oninput="editarEstilo('margin', this.value)">
        <label class="campo-label">Padding</label>
        <input class="campo-input" value="${cs.padding}" oninput="editarEstilo('padding', this.value)">
        <label class="campo-label">Borda</label>
        <input class="campo-input" value="${cs.border}" oninput="editarEstilo('border', this.value)">
        <label class="campo-label">Arredondamento</label>
        <input class="campo-input" value="${cs.borderRadius}" oninput="editarEstilo('borderRadius', this.value)">
      </div>

      <div class="grupo">
        <div class="grupo-titulo">Layout</div>
        <label class="campo-label">Display</label>
        <select class="campo-input" onchange="editarEstilo('display', this.value)">
          <option value="">— manter —</option>
          <option value="block">block</option>
          <option value="inline-block">inline-block</option>
          <option value="inline">inline</option>
          <option value="flex">flex</option>
          <option value="grid">grid</option>
          <option value="none">none (esconder)</option>
        </select>
        <label class="campo-label">Alinhamento texto</label>
        <select class="campo-input" onchange="editarEstilo('textAlign', this.value)">
          <option value="">— manter —</option>
          <option value="left">esquerda</option>
          <option value="center">centro</option>
          <option value="right">direita</option>
          <option value="justify">justificado</option>
        </select>
        <label class="campo-label">Posição</label>
        <select class="campo-input" onchange="editarEstilo('position', this.value)">
          <option value="">— manter —</option>
          <option value="static">static</option>
          <option value="relative">relative</option>
          <option value="absolute">absolute</option>
          <option value="fixed">fixed</option>
          <option value="sticky">sticky</option>
        </select>
        <label class="campo-label">Opacidade (0 a 1)</label>
        <input class="campo-input" type="range" min="0" max="1" step="0.05"
          value="${cs.opacity || 1}" oninput="editarEstilo('opacity', this.value)">
      </div>

      <div class="grupo">
        <div class="grupo-titulo">Ações</div>
        <div class="acoes-btn">
          <button class="btn green" onclick="duplicarElemento()">Duplicar</button>
          <button class="btn red" onclick="removerElemento()">Remover</button>
        </div>
        <div class="acoes-btn" style="margin-top:6px;">
          <button class="btn gray" onclick="sincronizarCodigo()">↺ Sync código</button>
        </div>
      </div>

    </div>
  `;
}

// ============================================================
//  FUNÇÕES DE EDIÇÃO
// ============================================================
function editarTexto(val) {
  if (!elementoSelecionado) return;
  elementoSelecionado.innerText = val;
  sincronizarCodigo();
}

function editarAttr(nome, val) {
  if (!elementoSelecionado) return;
  if (val.trim() === '') {
    elementoSelecionado.removeAttribute(nome);
  } else {
    elementoSelecionado.setAttribute(nome, val);
  }
  sincronizarCodigo();
}

function editarClasse(val) {
  if (!elementoSelecionado) return;
  elementoSelecionado.className = val;
  sincronizarCodigo();
}

function editarEstilo(prop, val) {
  if (!elementoSelecionado) return;
  elementoSelecionado.style[prop] = val;
  sincronizarCodigo();
}

function duplicarElemento() {
  if (!elementoSelecionado) return;
  const clone = elementoSelecionado.cloneNode(true);
  clone.classList.remove('__selecionado__');
  elementoSelecionado.insertAdjacentElement('afterend', clone);
  sincronizarCodigo();
  ativarCliques();
  status('Elemento duplicado.');
}

function removerElemento() {
  if (!elementoSelecionado) return;
  if (!confirm('Remover este elemento?')) return;
  elementoSelecionado.remove();
  elementoSelecionado = null;
  propsBody.innerHTML = '<div class="props-empty">Elemento removido.</div>';
  sincronizarCodigo();
  status('Elemento removido.');
}

// ============================================================
//  SINCRONIZAR CÓDIGO (iframe → textarea)
// ============================================================
function sincronizarCodigo() {
  const doc = frame.contentDocument || frame.contentWindow.document;
  if (!doc) return;

  // remove marcações do editor antes de exportar
  doc.querySelectorAll('.__selecionado__').forEach(x => x.classList.remove('__selecionado__'));
  doc.querySelectorAll('.__hover__').forEach(x => x.classList.remove('__hover__'));
  const estiloEditor = doc.getElementById('__editor_estilo__');
  if (estiloEditor) estiloEditor.remove();

  codeInput.value = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;

  // reaplica estilo e seleção
  ativarCliques();
  if (elementoSelecionado) {
    elementoSelecionado.classList.add('__selecionado__');
  }
}

// ============================================================
//  COPIAR CÓDIGO
// ============================================================
function copiarCodigo() {
  const codigo = codeInput.value;
  if (!codigo.trim()) {
    alert('Nada para copiar.');
    return;
  }
  navigator.clipboard.writeText(codigo).then(() => {
    status('Código copiado!');
  }).catch(() => {
    codeInput.focus();
    codeInput.select();
    alert('Use Ctrl+A depois Ctrl+C para copiar.');
  });
}

// ============================================================
//  BAIXAR HTML
// ============================================================
function baixarHTML() {
  const codigo = codeInput.value;
  if (!codigo.trim()) {
    alert('Nada para baixar.');
    return;
  }
  const blob = new Blob([codigo], { type: 'text/html;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'codigo-editado.html';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  status('Arquivo baixado.');
}

// ============================================================
//  DESFAZER
// ============================================================
function salvarHistorico() {
  if (historico.length >= 50) historico.shift();
  historico.push(codeInput.value);
}

function desfazer() {
  if (historico.length === 0) {
    status('Nada para desfazer.');
    return;
  }
  codeInput.value = historico.pop();
  renderizar();
  status('Desfeito.');
}

// ============================================================
//  LIMPAR TUDO
// ============================================================
function limparTudo() {
  if (!confirm('Limpar tudo?')) return;
  salvarHistorico();
  codeInput.value = '';
  const doc = frame.contentDocument || frame.contentWindow.document;
  doc.open(); doc.write(''); doc.close();
  elementoSelecionado = null;
  propsBody.innerHTML = '<div class="props-empty">Cole ou importe um código.</div>';
  status('Tudo limpo.');
}

// ============================================================
//  UTILITÁRIOS
// ============================================================
function rgb2hex(rgb) {
  if (!rgb) return '#ffffff';
  const m = rgb.match(/\d+/g);
  if (!m || m.length < 3) return '#ffffff';
  return '#' +
    parseInt(m[0]).toString(16).padStart(2,'0') +
    parseInt(m[1]).toString(16).padStart(2,'0') +
    parseInt(m[2]).toString(16).padStart(2,'0');
}

function e(str) {
  return String(str || '')
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

// ============================================================
//  INICIA COM O EXEMPLO
// ============================================================
renderizar();
</script>
