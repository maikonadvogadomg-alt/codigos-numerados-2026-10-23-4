<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Iara Mapper Pro — Dr. Maikon Caldeira</title>
  
  <!-- Highlight.js para syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <!-- JSZip para ler ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 0;
    }
    
    /* ── HEADER ── */
    .header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      z-index: 100;
    }
    
    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: #58a6ff;
      min-width: 200px;
    }
    
    .header-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .btn {
      padding: 8px 14px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }
    
    .btn:hover:not(:disabled) {
      background: #4f46e5;
      transform: translateY(-1px);
    }
    
    .btn:disabled {
      background: #475569;
      cursor: not-allowed;
      opacity: 0.5;
    }
    
    .btn.secondary {
      background: #475569;
    }
    
    .btn.secondary:hover:not(:disabled) {
      background: #64748b;
    }
    
    .btn.danger {
      background: #ff6b6b;
    }
    
    .btn.danger:hover:not(:disabled) {
      background: #ff5252;
    }
    
    .btn.success {
      background: #3fb950;
    }
    
    .btn.success:hover:not(:disabled) {
      background: #2d8659;
    }
    
    .header-status {
      margin-left: auto;
      font-size: 11px;
      color: #94a3b8;
      min-width: 150px;
      text-align: right;
    }
    
    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }
    
    .file-input-wrapper input[type="file"] {
      position: absolute;
      left: -9999px;
    }
    
    /* ── MAIN CONTENT ── */
    .content {
      flex: 1;
      display: flex;
      gap: 0;
      overflow: hidden;
    }
    
    /* ── SIDEBAR ── */
    .sidebar {
      width: 300px;
      background: #1e293b;
      border-right: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.3s;
    }
    
    .sidebar.collapsed {
      width: 0;
      border-right: none;
    }
    
    .sidebar-header {
      padding: 12px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .sidebar-header h3 {
      font-size: 12px;
      color: #58a6ff;
    }
    
    .sidebar-toggle {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
    }
    
    .sidebar-search {
      padding: 8px;
      border-bottom: 1px solid #334155;
    }
    
    .sidebar-search input {
      width: 100%;
      padding: 6px 8px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      color: #e2e8f0;
      font-size: 11px;
    }
    
    .sidebar-search input:focus {
      outline: none;
      border-color: #58a6ff;
    }
    
    .files-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    
    .file-item {
      padding: 8px;
      margin-bottom: 6px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 11px;
      word-break: break-word;
    }
    
    .file-item:hover {
      background: #1e293b;
      border-color: #58a6ff;
    }
    
    .file-item.active {
      background: #1e293b;
      border-color: #3fb950;
      box-shadow: 0 0 8px rgba(63, 185, 80, 0.3);
    }
    
    .file-item-name {
      color: #58a6ff;
      font-weight: 600;
      margin-bottom: 2px;
    }
    
    .file-item-info {
      color: #94a3b8;
      font-size: 10px;
    }
    
    /* ── MAIN AREA ── */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .editor-preview {
      flex: 1;
      display: flex;
      gap: 0;
      overflow: hidden;
    }
    
    .editor-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #334155;
      overflow: hidden;
    }
    
    .panel-header {
      padding: 8px 12px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .panel-header-title {
      font-weight: 600;
      color: #58a6ff;
    }
    
    .editor-wrapper {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    
    .line-numbers {
      background: #0f172a;
      color: #475569;
      padding: 8px 12px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
      border-right: 1px solid #334155;
      overflow: hidden;
      user-select: none;
      text-align: right;
    }
    
    .code-editor {
      flex: 1;
      padding: 8px 12px;
      background: #0f172a;
      color: #e2e8f0;
      border: none;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
      resize: none;
      outline: none;
      overflow: auto;
      white-space: pre;
      word-wrap: normal;
    }
    
    .code-editor::selection {
      background: rgba(88, 166, 255, 0.3);
    }
    
    .preview-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-left: 1px solid #334155;
      overflow: hidden;
    }
    
    .preview-content {
      flex: 1;
      overflow: auto;
      background: #0f172a;
      padding: 12px;
    }
    
    .preview-code {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #e2e8f0;
      overflow: auto;
      max-height: 100%;
    }
    
    .preview-code code {
      color: inherit;
    }
    
    /* Syntax highlighting */
    .hljs {
      background: transparent !important;
      color: #e2e8f0;
    }
    
    .hljs-attr { color: #58a6ff; }
    .hljs-string { color: #3fb950; }
    .hljs-number { color: #ffc107; }
    .hljs-literal { color: #ff6b6b; }
    .hljs-title { color: #58a6ff; }
    .hljs-function { color: #58a6ff; }
    .hljs-keyword { color: #ff6b6b; }
    .hljs-comment { color: #475569; }
    .hljs-tag { color: #ff6b6b; }
    .hljs-name { color: #58a6ff; }
    
    /* ── BOTTOM PANEL ── */
    .bottom-panel {
      height: 200px;
      background: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .bottom-header {
      padding: 8px 12px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      font-size: 11px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .bottom-header-title {
      font-weight: 600;
      color: #58a6ff;
    }
    
    .bottom-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      font-size: 11px;
      font-family: monospace;
      line-height: 1.5;
    }
    
    .info-item {
      margin-bottom: 8px;
      padding: 6px;
      background: #0f172a;
      border-left: 3px solid #58a6ff;
      border-radius: 2px;
    }
    
    .info-label {
      color: #94a3b8;
      font-size: 10px;
    }
    
    .info-value {
      color: #3fb950;
      font-weight: 600;
    }
    
    /* ── MODAL ── */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 10000;
      align-items: center;
      justify-content: center;
    }
    
    .modal.open {
      display: flex;
    }
    
    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      border: 1px solid #334155;
    }
    
    .modal-title {
      font-size: 14px;
      font-weight: 600;
      color: #58a6ff;
      margin-bottom: 12px;
    }
    
    .modal-text {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    
    .modal-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    
    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 16px;
      background: #3fb950;
      color: #fff;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      z-index: 9999;
      animation: slideIn 0.3s ease-out;
      max-width: 300px;
    }
    
    .toast.err { background: #ff6b6b; }
    .toast.warn { background: #ffc107; color: #000; }
    
    @keyframes slideIn {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    /* ── RESPONSIVO ── */
    @media (max-width: 1024px) {
      .sidebar { width: 250px; }
      .btn { font-size: 10px; padding: 6px 12px; }
    }
    
    @media (max-width: 768px) {
      .content {
        flex-direction: column;
      }
      
      .sidebar {
        width: 100%;
        height: 150px;
        border-right: none;
        border-bottom: 1px solid #334155;
      }
      
      .sidebar.collapsed {
        height: 0;
        border-bottom: none;
      }
      
      .editor-preview {
        flex-direction: column;
      }
      
      .editor-panel {
        border-right: none;
        border-bottom: 1px solid #334155;
      }
      
      .preview-panel {
        border-left: none;
      }
      
      .bottom-panel {
        height: 150px;
      }
      
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .header-status {
        margin-left: 0;
        text-align: left;
      }
    }
    
    @media (max-width: 480px) {
      .header { padding: 8px; }
      .btn { font-size: 9px; padding: 6px 10px; }
      .header-title { font-size: 12px; min-width: auto; }
      .sidebar { height: 120px; }
      .bottom-panel { height: 120px; }
      .code-editor { font-size: 10px; }
      .preview-code { font-size: 10px; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <div class="header-title">🔍 Iara Mapper Pro</div>
    
    <div class="header-buttons">
      <div class="file-input-wrapper">
        <button class="btn">📁 Importar</button>
        <input type="file" id="file-input" accept="*" multiple>
      </div>
      <button class="btn secondary" id="btn-preview">👁️ Preview</button>
      <button class="btn secondary" id="btn-search">🔍 Buscar</button>
      <button class="btn danger" id="btn-clear">🗑️ Limpar</button>
      <button class="btn success" id="btn-export">💾 Exportar</button>
    </div>
    
    <div class="header-status">
      <span id="status-text">Pronto</span>
    </div>
  </div>
  
  <!-- CONTENT -->
  <div class="content">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>📂 Arquivos</h3>
        <button class="sidebar-toggle" onclick="toggleSidebar()">✕</button>
      </div>
      
      <div class="sidebar-search">
        <input type="text" id="search-files" placeholder="🔍 Buscar arquivo...">
      </div>
      
      <div class="files-list" id="files-list">
        <div style="color: #94a3b8; font-size: 11px; text-align: center; padding: 20px;">
          📁 Importe um arquivo
        </div>
      </div>
    </div>
    
    <!-- MAIN AREA -->
    <div class="main-area">
      <!-- EDITOR + PREVIEW -->
      <div class="editor-preview">
        <!-- EDITOR -->
        <div class="editor-panel">
          <div class="panel-header">
            <span class="panel-header-title" id="editor-title">📄 Editor</span>
            <span id="editor-info" style="font-size: 10px; color: #94a3b8;"></span>
          </div>
          <div class="editor-wrapper">
            <div class="line-numbers" id="line-numbers"></div>
            <textarea class="code-editor" id="code-editor" placeholder="Importe um arquivo..." readonly></textarea>
          </div>
        </div>
        
        <!-- PREVIEW -->
        <div class="preview-panel">
          <div class="panel-header">
            <span class="panel-header-title">👁️ Preview</span>
          </div>
          <div class="preview-content" id="preview-content">
            <div style="color: #94a3b8; font-size: 12px; text-align: center; padding: 20px;">
              👀 Selecione um arquivo
            </div>
          </div>
        </div>
      </div>
      
      <!-- BOTTOM PANEL -->
      <div class="bottom-panel">
        <div class="bottom-header">
          <span class="bottom-header-title">ℹ️ Informações</span>
          <button class="sidebar-toggle" onclick="toggleBottom()" style="color: #94a3b8;">−</button>
        </div>
        <div class="bottom-content" id="bottom-content">
          <div class="info-item">
            <div class="info-label">Status:</div>
            <div class="info-value">Aguardando arquivo...</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="confirm-modal">
  <div class="modal-content">
    <div class="modal-title">⚠️ Confirmação</div>
    <div class="modal-text" id="modal-text"></div>
    <div class="modal-buttons">
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn success" onclick="confirmAction()">Confirmar</button>
    </div>
  </div>
</div>

<script>
  /* ═══════════════════════════════════════
     IARA MAPPER PRO — SISTEMA COMPLETO
  ═══════════════════════════════════════ */
  
  const qs = s => document.querySelector(s);
  const qsa = s => [...document.querySelectorAll(s)];
  
  // Detecção de linguagem
  const LANG_MAP = {
    'js': 'javascript', 'jsx': 'javascript', 'mjs': 'javascript', 'cjs': 'javascript',
    'ts': 'typescript', 'tsx': 'typescript',
    'py': 'python', 'pyw': 'python',
    'java': 'java', 'kt': 'kotlin',
    'cs': 'csharp', 'cpp': 'cpp', 'c': 'c', 'h': 'c',
    'rb': 'ruby', 'go': 'go', 'rs': 'rust',
    'php': 'php', 'html': 'html', 'htm': 'html',
    'css': 'css', 'scss': 'scss', 'sass': 'sass', 'less': 'less',
    'json': 'json', 'yaml': 'yaml', 'yml': 'yaml', 'toml': 'toml', 'xml': 'xml',
    'sql': 'sql', 'prisma': 'prisma',
    'md': 'markdown', 'txt': 'plaintext',
    'sh': 'bash', 'bat': 'batch', 'ps1': 'powershell',
    'graphql': 'graphql', 'r': 'r', 'lua': 'lua', 'perl': 'perl',
    'swift': 'swift', 'kotlin': 'kotlin', 'scala': 'scala', 'clojure': 'clojure'
  };
  
  let files = [];
  let currentFile = null;
  
  // Toast
  function toast(msg, type = 'ok') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
  }
  
  // Get file extension
  function getExt(name) {
    return (name.split('.').pop() || '').toLowerCase();
  }
  
  // Detect language
  function detectLang(name) {
    const ext = getExt(name);
    return LANG_MAP[ext] || 'plaintext';
  }
  
  // Detect encoding
  function detectEncoding(content) {
    try {
      new TextEncoder().encode(content);
      return 'UTF-8';
    } catch {
      return 'Unknown';
    }
  }
  
  // Update line numbers
  function updateLineNums() {
    const ta = qs('#code-editor');
    const ln = qs('#line-numbers');
    const lines = ta.value.split('\n').length;
    ln.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('\n');
  }
  
  // Sync scroll
  function syncScroll() {
    const ta = qs('#code-editor');
    const ln = qs('#line-numbers');
    ln.scrollTop = ta.scrollTop;
  }
  
  // Handle file upload
  async function handleFileUpload(e) {
    const fileList = e.target.files;
    if (!fileList.length) return;
    
    qs('#status-text').textContent = '📥 Processando...';
    
    try {
      for (let file of fileList) {
        if (file.name.endsWith('.zip')) {
          await handleZip(file);
        } else {
          await handleSingleFile(file);
        }
      }
      renderFilesList();
      toast('✅ Arquivo(s) carregado(s)!');
    } catch (err) {
      toast('❌ Erro: ' + err.message, 'err');
    }
    
    qs('#status-text').textContent = 'Pronto';
  }
  
  // Handle single file
  async function handleSingleFile(file) {
    const content = await file.text();
    const ext = getExt(file.name);
    const lang = detectLang(file.name);
    const encoding = detectEncoding(content);
    
    files.push({
      name: file.name,
      content: content,
      ext: ext,
      lang: lang,
      encoding: encoding,
      size: file.size,
      type: 'file'
    });
  }
  
  // Handle ZIP
  async function handleZip(file) {
    try {
      const zip = await JSZip.loadAsync(file);
      
      for (const [path, obj] of Object.entries(zip.files)) {
        if (obj.dir) continue;
        
        try {
          const content = await obj.async('text');
          const ext = getExt(path);
          const lang = detectLang(path);
          const encoding = detectEncoding(content);
          
          files.push({
            name: path,
            content: content,
            ext: ext,
            lang: lang,
            encoding: encoding,
            size: obj._data.uncompressedSize,
            type: 'zip'
          });
        } catch (err) {
          console.warn('Erro ao ler ' + path, err);
        }
      }
    } catch (err) {
      throw new Error('Erro ao processar ZIP: ' + err.message);
    }
  }
  
  // Render files list
  function renderFilesList() {
    const query = qs('#search-files').value.toLowerCase();
    const filtered = files.filter(f => f.name.toLowerCase().includes(query));
    
    const html = filtered.map((f, i) => `
      <div class="file-item ${currentFile === i ? 'active' : ''}" onclick="selectFile(${i})">
        <div class="file-item-name">
          ${getExt(f.name) === 'html' ? '🌐' : 
            getExt(f.name) === 'css' ? '🎨' : 
            getExt(f.name) === 'js' ? '📜' : 
            getExt(f.name) === 'json' ? '📋' : 
            getExt(f.name) === 'py' ? '🐍' : '📄'}
          ${f.name.split('/').pop()}
        </div>
        <div class="file-item-info">
          ${f.lang} · ${(f.size / 1024).toFixed(1)}KB · ${f.encoding}
        </div>
      </div>
    `).join('');
    
    qs('#files-list').innerHTML = html || '<div style="color: #94a3b8; font-size: 11px; padding: 20px;">Nenhum arquivo</div>';
  }
  
  // Select file
  function selectFile(i) {
    currentFile = i;
    const file = files[i];
    
    qs('#code-editor').value = file.content;
    qs('#editor-title').textContent = `📄 ${file.name}`;
    qs('#editor-info').textContent = `${file.lang.toUpperCase()} · ${file.encoding}`;
    
    updateLineNums();
    updateInfo(file);
    updatePreview(file);
    renderFilesList();
  }
  
  // Update info
  function updateInfo(file) {
    const lines = file.content.split('\n').length;
    const chars = file.content.length;
    
    qs('#bottom-content').innerHTML = `
      <div class="info-item">
        <div class="info-label">Arquivo:</div>
        <div class="info-value">${file.name}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Linguagem:</div>
        <div class="info-value">${file.lang.toUpperCase()}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Codificação:</div>
        <div class="info-value">${file.encoding}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Linhas:</div>
        <div class="info-value">${lines}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Caracteres:</div>
        <div class="info-value">${chars}</div>
      </div>
      <div class="info-item">
        <div class="info-label">Tamanho:</div>
        <div class="info-value">${(file.size / 1024).toFixed(2)}KB</div>
      </div>
    `;
  }
  
  // Update preview
  function updatePreview(file) {
    const lang = file.lang;
    let html = file.content;
    
    if (lang === 'html') {
      qs('#preview-content').innerHTML = `<iframe style="width:100%;height:100%;border:none;background:#fff" srcdoc="${html.replace(/"/g, '&quot;')}"></iframe>`;
    } else {
      try {
        const highlighted = hljs.highlight(html, {language: lang, ignoreIllegals: true}).value;
        qs('#preview-content').innerHTML = `<div class="preview-code"><code>${highlighted}</code></div>`;
      } catch (err) {
        qs('#preview-content').innerHTML = `<div class="preview-code"><code>${html}</code></div>`;
      }
    }
  }
  
  // Toggle sidebar
  function toggleSidebar() {
    qs('#sidebar').classList.toggle('collapsed');
  }
  
  // Toggle bottom
  function toggleBottom() {
    qs('.bottom-panel').style.display = qs('.bottom-panel').style.display === 'none' ? 'flex' : 'none';
  }
  
  // Clear all
  function clearAll() {
    qs('#modal-text').textContent = 'Limpar todos os arquivos?';
    qs('#confirm-modal').classList.add('open');
    window.confirmAction = () => {
      files = [];
      currentFile = null;
      qs('#code-editor').value = '';
      qs('#files-list').innerHTML = '<div style="color: #94a3b8; font-size: 11px; text-align: center; padding: 20px;">📁 Importe um arquivo</div>';
      qs('#preview-content').innerHTML = '<div style="color: #94a3b8; font-size: 12px; text-align: center; padding: 20px;">👀 Selecione um arquivo</div>';
      qs('#confirm-modal').classList.remove('open');
      toast('🗑️ Tudo limpo!');
    };
  }
  
  // Export
  function exportFile() {
    if (currentFile === null) {
      toast('❌ Selecione um arquivo', 'err');
      return;
    }
    
    const file = files[currentFile];
    const blob = new Blob([file.content], {type: 'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = file.name;
    a.click();
    toast('✅ Exportado!');
  }
  
  // Close modal
  function closeModal() {
    qs('#confirm-modal').classList.remove('open');
  }
  
  // Events
  qs('#file-input').addEventListener('change', handleFileUpload);
  qs('#search-files').addEventListener('input', renderFilesList);
  qs('#btn-clear').addEventListener('click', clearAll);
  qs('#btn-export').addEventListener('click', exportFile);
  qs('#code-editor').addEventListener('scroll', syncScroll);
  
  // Prevent readonly
  qs('#code-editor').addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
      e.preventDefault();
      const selected = qs('#code-editor').value.substring(
        qs('#code-editor').selectionStart,
        qs('#code-editor').selectionEnd
      );
      navigator.clipboard.writeText(selected);
      toast('📋 Copiado!');
    }
  });
</script>

</body>
</html>
