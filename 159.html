<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎨 Editor Visual - Funcional</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1e1e;
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #2d2d2d;
      padding: 15px;
      border-bottom: 2px solid #007acc;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 18px;
      color: #007acc;
      flex: 1;
      min-width: 200px;
    }

    .header button {
      padding: 10px 16px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .header button:hover {
      background: #005a9e;
    }

    .header button.danger {
      background: #d13438;
    }

    .header button.danger:hover {
      background: #a1262f;
    }

    #fileInput {
      display: none;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 2px;
    }

    /* PAINEL ESQUERDO - CÓDIGO */
    .left-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      border-right: 2px solid #3e3e42;
    }

    .panel-header {
      background: #2d2d2d;
      padding: 10px;
      border-bottom: 1px solid #3e3e42;
      font-size: 12px;
      color: #999;
      font-weight: bold;
    }

    .code-input {
      flex: 1;
      background: #1e1e1e;
      color: #d4d4d4;
      border: none;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      resize: none;
      overflow: auto;
    }

    .code-input:focus {
      outline: none;
      background: #252526;
    }

    /* PAINEL CENTRAL - PREVIEW */
    .center-panel {
      flex: 1.5;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      border-right: 2px solid #3e3e42;
    }

    .preview-container {
      flex: 1;
      background: white;
      overflow: auto;
      position: relative;
    }

    .preview-content {
      padding: 20px;
    }

    /* ELEMENTO SELECIONADO */
    .element-selected {
      outline: 3px solid #007acc !important;
      outline-offset: 2px;
      position: relative;
      box-shadow: inset 0 0 10px rgba(0, 122, 204, 0.3);
    }

    /* PAINEL DIREITO - PROPRIEDADES */
    .right-panel {
      width: 320px;
      background: #252526;
      border-left: 2px solid #3e3e42;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .props-header {
      background: #2d2d2d;
      padding: 12px;
      border-bottom: 1px solid #3e3e42;
      font-size: 12px;
      color: #007acc;
      font-weight: bold;
    }

    .props-content {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .prop-group {
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #3e3e42;
    }

    .prop-group:last-child {
      border-bottom: none;
    }

    .prop-group-title {
      color: #007acc;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .prop-item {
      margin-bottom: 10px;
    }

    .prop-label {
      color: #999;
      font-size: 11px;
      margin-bottom: 4px;
      display: block;
    }

    .prop-input, .prop-select {
      width: 100%;
      background: #3e3e42;
      color: #d4d4d4;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 3px;
      font-size: 12px;
      font-family: 'Courier New', monospace;
    }

    .prop-input:focus, .prop-select:focus {
      outline: none;
      border-color: #007acc;
      background: #1e1e1e;
    }

    .prop-color {
      width: 100%;
      height: 35px;
      border: 1px solid #555;
      border-radius: 3px;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .button-group button {
      flex: 1;
      padding: 8px;
      background: #007acc;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }

    .button-group button:hover {
      background: #005a9e;
    }

    .button-group button.danger {
      background: #d13438;
    }

    .button-group button.danger:hover {
      background: #a1262f;
    }

    .no-selection {
      color: #999;
      padding: 20px;
      text-align: center;
      font-size: 12px;
    }

    .status-bar {
      background: #2d2d2d;
      padding: 8px 15px;
      border-top: 1px solid #3e3e42;
      font-size: 11px;
      color: #999;
    }

    /* MODAL COLAR */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #252526;
      border: 2px solid #007acc;
      border-radius: 8px;
      padding: 20px;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-title {
      color: #007acc;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .modal-textarea {
      flex: 1;
      background: #1e1e1e;
      color: #d4d4d4;
      border: 1px solid #555;
      padding: 12px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      resize: none;
      margin-bottom: 12px;
    }

    .modal-textarea:focus {
      outline: none;
      border-color: #007acc;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 13px;
    }

    .modal-buttons button.confirm {
      background: #007acc;
      color: white;
    }

    .modal-buttons button.confirm:hover {
      background: #005a9e;
    }

    .modal-buttons button.cancel {
      background: #555;
      color: white;
    }

    .modal-buttons button.cancel:hover {
      background: #666;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #1e1e1e;
    }

    ::-webkit-scrollbar-thumb {
      background: #464647;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #5a5a5a;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎨 Editor Visual - Funcional</h1>
    <button onclick="abrirModalColar()">📋 Colar Código</button>
    <button onclick="abrirImportador()">📂 Importar Arquivo</button>
    <button onclick="copiarCodigoFinal()">📋 Copiar Código</button>
    <button onclick="salvarCodigoFinal()" class="danger">💾 Salvar Arquivo</button>
  </div>

  <div class="container">
    <!-- PAINEL ESQUERDO: CÓDIGO -->
    <div class="left-panel">
      <div class="panel-header">📝 Código HTML (Editável)</div>
      <textarea id="codeInput" class="code-input" placeholder="Cole seu código aqui ou use o botão 'Colar Código'..."></textarea>
    </div>

    <!-- PAINEL CENTRAL: PREVIEW -->
    <div class="center-panel">
      <div class="panel-header">👁️ Preview (Clique para editar)</div>
      <div class="preview-container">
        <div id="previewContent" class="preview-content"></div>
      </div>
    </div>

    <!-- PAINEL DIREITO: PROPRIEDADES -->
    <div class="right-panel">
      <div class="props-header">⚙️ Propriedades do Elemento</div>
      <div class="props-content" id="propsContent">
        <div class="no-selection">👆 Clique em um elemento para editar</div>
      </div>
    </div>
  </div>

  <div class="status-bar" id="statusBar">✅ Pronto para editar</div>

  <!-- MODAL COLAR -->
  <div class="modal" id="modalColar">
    <div class="modal-content">
      <div class="modal-title">📋 Cole seu código HTML aqui:</div>
      <textarea id="textareaColar" class="modal-textarea" placeholder="Cole o código HTML aqui..."></textarea>
      <div class="modal-buttons">
        <button class="confirm" onclick="confirmarColar()">✅ Colar</button>
        <button class="cancel" onclick="fecharModal()">❌ Cancelar</button>
      </div>
    </div>
  </div>

  <!-- INPUT FILE OCULTO -->
  <input type="file" id="fileInput" accept=".html,.htm,.txt" onchange="importarArquivo()">

  <script>
    let selectedElement = null;

    // ===== MODAL COLAR =====
    function abrirModalColar() {
      document.getElementById('modalColar').classList.add('active');
      document.getElementById('textareaColar').focus();
    }

    function fecharModal() {
      document.getElementById('modalColar').classList.remove('active');
    }

    function confirmarColar() {
      const codigo = document.getElementById('textareaColar').value;
      if (codigo.trim()) {
        document.getElementById('codeInput').value = codigo;
        renderizarPreview();
        fecharModal();
        document.getElementById('textareaColar').value = '';
      } else {
        alert('⚠️ Cole um código primeiro!');
      }
    }

    // ===== IMPORTADOR DE ARQUIVO =====
    function abrirImportador() {
      document.getElementById('fileInput').click();
    }

    function importarArquivo() {
      const file = document.getElementById('fileInput').files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const codigo = e.target.result;
          document.getElementById('codeInput').value = codigo;
          renderizarPreview();
          document.getElementById('statusBar').textContent = `✅ Arquivo importado: ${file.name}`;
        };
        reader.readAsText(file);
      }
    }

    // ===== RENDERIZAR PREVIEW =====
    function renderizarPreview() {
      const codigo = document.getElementById('codeInput').value;
      
      try {
        const preview = document.getElementById('previewContent');
        preview.innerHTML = codigo;
        
        adicionarListeners(preview);
        
        document.getElementById('statusBar').textContent = '✅ Código renderizado com sucesso';
      } catch (e) {
        document.getElementById('statusBar').textContent = '❌ Erro: ' + e.message;
      }
    }

    // ===== ADICIONAR LISTENERS =====
    function adicionarListeners(container) {
      const elementos = container.querySelectorAll('*');
      
      elementos.forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          selecionarElemento(el);
        });
        
        el.addEventListener('mouseover', (e) => {
          e.stopPropagation();
          if (el !== selectedElement) {
            el.style.outline = '1px dashed #007acc';
            el.style.outlineOffset = '2px';
          }
        });
        
        el.addEventListener('mouseout', (e) => {
          e.stopPropagation();
          if (el !== selectedElement) {
            el.style.outline = 'none';
          }
        });
      });
    }

    // ===== SELECIONAR ELEMENTO =====
    function selecionarElemento(el) {
      if (selectedElement) {
        selectedElement.classList.remove('element-selected');
      }
      
      selectedElement = el;
      selectedElement.classList.add('element-selected');
      
      mostrarPropriedades(el);
      
      document.getElementById('statusBar').textContent = `✅ Selecionado: <${el.tagName.toLowerCase()}>`;
    }

    // ===== MOSTRAR PROPRIEDADES =====
    function mostrarPropriedades(el) {
      const props = document.getElementById('propsContent');
      const styles = window.getComputedStyle(el);
      
      props.innerHTML = `
        <div class="prop-group">
          <div class="prop-group-title">📍 Elemento</div>
          <div class="prop-item">
            <label class="prop-label">Tag:</label>
            <input type="text" class="prop-input" value="${el.tagName}" disabled>
          </div>
          <div class="prop-item">
            <label class="prop-label">ID:</label>
            <input type="text" class="prop-input" value="${el.id || ''}" onchange="atualizarPropriedade('id', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Classe:</label>
            <input type="text" class="prop-input" value="${el.className || ''}" onchange="atualizarPropriedade('className', this.value)">
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-group-title">🎨 Cores</div>
          <div class="prop-item">
            <label class="prop-label">Cor do Texto:</label>
            <input type="color" class="prop-color" value="${rgbToHex(styles.color)}" onchange="atualizarEstilo('color', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Fundo:</label>
            <input type="color" class="prop-color" value="${rgbToHex(styles.backgroundColor)}" onchange="atualizarEstilo('backgroundColor', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Borda:</label>
            <input type="color" class="prop-color" value="${rgbToHex(styles.borderColor)}" onchange="atualizarEstilo('borderColor', this.value)">
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-group-title">📏 Tamanho</div>
          <div class="prop-item">
            <label class="prop-label">Largura:</label>
            <input type="text" class="prop-input" value="${styles.width}" onchange="atualizarEstilo('width', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Altura:</label>
            <input type="text" class="prop-input" value="${styles.height}" onchange="atualizarEstilo('height', this.value)">
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-group-title">🔤 Texto</div>
          <div class="prop-item">
            <label class="prop-label">Tamanho da Fonte:</label>
            <input type="text" class="prop-input" value="${styles.fontSize}" onchange="atualizarEstilo('fontSize', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Peso da Fonte:</label>
            <select class="prop-select" onchange="atualizarEstilo('fontWeight', this.value)">
              <option value="normal">Normal</option>
              <option value="bold">Bold</option>
              <option value="700">700</option>
              <option value="800">800</option>
              <option value="900">900</option>
            </select>
          </div>
          <div class="prop-item">
            <label class="prop-label">Alinhamento:</label>
            <select class="prop-select" onchange="atualizarEstilo('textAlign', this.value)">
              <option value="left">Esquerda</option>
              <option value="center">Centro</option>
              <option value="right">Direita</option>
              <option value="justify">Justificado</option>
            </select>
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-group-title">📦 Espaçamento</div>
          <div class="prop-item">
            <label class="prop-label">Padding:</label>
            <input type="text" class="prop-input" value="${styles.padding}" onchange="atualizarEstilo('padding', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Margin:</label>
            <input type="text" class="prop-input" value="${styles.margin}" onchange="atualizarEstilo('margin', this.value)">
          </div>
          <div class="prop-item">
            <label class="prop-label">Borda:</label>
            <input type="text" class="prop-input" value="${styles.border}" onchange="atualizarEstilo('border', this.value)">
          </div>
        </div>

        <div class="prop-group">
          <div class="prop-group-title">✏️ Conteúdo</div>
          <div class="prop-item">
            <label class="prop-label">Texto:</label>
            <textarea class="prop-input" style="height: 70px; resize: vertical;" onchange="atualizarTexto(this.value)">${el.textContent}</textarea>
          </div>
        </div>

        <div class="button-group">
          <button onclick="atualizarCodigoFonte()">🔄 Atualizar</button>
          <button onclick="removerElemento()" class="danger">🗑️ Remover</button>
        </div>
      `;
    }

    // ===== ATUALIZAR ESTILO =====
    function atualizarEstilo(propriedade, valor) {
      if (selectedElement) {
        selectedElement.style[propriedade] = valor;
        atualizarCodigoFonte();
      }
    }

    // ===== ATUALIZAR PROPRIEDADE =====
    function atualizarPropriedade(propriedade, valor) {
      if (selectedElement) {
        selectedElement[propriedade] = valor;
        atualizarCodigoFonte();
      }
    }

    // ===== ATUALIZAR TEXTO =====
    function atualizarTexto(texto) {
      if (selectedElement) {
        selectedElement.textContent = texto;
        atualizarCodigoFonte();
      }
    }

    // ===== REMOVER ELEMENTO =====
    function removerElemento() {
      if (selectedElement && confirm('Tem certeza que quer remover este elemento?')) {
        selectedElement.remove();
        selectedElement = null;
        atualizarCodigoFonte();
        document.getElementById('propsContent').innerHTML = '<div class="no-selection">👆 Clique em um elemento para editar</div>';
      }
    }

    // ===== ATUALIZAR CÓDIGO FONTE =====
    function atualizarCodigoFonte() {
      const preview = document.getElementById('previewContent');
      document.getElementById('codeInput').value = preview.innerHTML;
    }

    // ===== COPIAR CÓDIGO =====
    function copiarCodigoFinal() {
      const codigo = document.getElementById('codeInput').value;
      navigator.clipboard.writeText(codigo).then(() => {
        document.getElementById('statusBar').textContent = '✅ Código copiado para a área de transferência!';
      }).catch(() => {
        alert('❌ Erro ao copiar!');
      });
    }

    // ===== SALVAR ARQUIVO =====
    function salvarCodigoFinal() {
      const codigo = document.getElementById('codeInput').value;
      const blob = new Blob([codigo], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'codigo-editado.html';
      a.click();
      document.getElementById('statusBar').textContent = '✅ Arquivo salvo!';
    }

    // ===== RGB PARA HEX =====
    function rgbToHex(rgb) {
      if (!rgb || rgb === 'rgba(0, 0, 0, 0)') return '#ffffff';
      
      const match = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
      if (!match) return '#ffffff';
      
      const hex = (x) => {
        return ("0" + parseInt(x).toString(16)).slice(-2);
      };
      
      return "#" + hex(match[1]) + hex(match[2]) + hex(match[3]);
    }

    // ===== ATUALIZAR PREVIEW AO DIGITAR =====
    document.getElementById('codeInput').addEventListener('input', () => {
      renderizarPreview();
    });

    // ===== FECHAR MODAL COM ESC =====
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        fecharModal();
      }
    });

    // ===== EXEMPLO INICIAL =====
    document.getElementById('codeInput').value = `<div style="background: #f0f4f8; border-radius: 10px; padding: 20px; text-align: center; max-width: 500px; margin: 20px auto;">
  <h2 style="color: #1a73e8; margin-bottom: 10px;">🚀 Editor Visual</h2>
  <p style="color: #666; margin-bottom: 20px;">Clique nos elementos para editar suas propriedades</p>
  <button style="padding: 10px 20px; background: #1a73e8; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Clique aqui</button>
</div>`;

    renderizarPreview();
  </script>
</body>
</html>
